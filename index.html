darajasida faqat qisqa muddatli javoblar kuzatiladi, ammo uzoq muddatli oʻzgarishlar mavjud emas.", "Organizmning funksional tizimlari buzilishlarga uchrab, surunkali stress holati yuzaga keladi."], ["Simpatoadrenal tizim stress omili ta'sirida qanday reaksiyalarni keltirib chiqaradi va baland tog' sharoitidagi moslashishda uning faoliyati qanday optimallashadi?", "Yurak urish tezligini oshiradi, qon tomirlarini oʻzgartiradi; baland togʻda katexolamin sintezi susayadi.", "Nafas olish tezligini pasaytiradi, ter ajralishini kamaytiradi; baland togʻda katexolamin sintezi kuchayadi.", "Glyukoneogenezni bloklaydi, oziq moddalar soʻrilishini sekinlashtiradi; baland togʻda faolligi oʻzgarmas qoladi.", "Immun tizimini zaiflashtiradi, giston oqsillarining modifikatsiyasini toʻxtatadi; baland togʻda serotonin ishlab chiqaradi."], ["Hujayra-avtonom adaptasiyalar (CAA) organizmning umumiy moslashishiga qanday hissa qoʻshadi va gipoksik sharoitdagi misolini tushuntiring?", "Aloqa hujayralar funksiyasini yaxshilab, mitoxondriyalarning kisloroddan foydalanishini oshiradi.", "Faqat stressga javoban immun tizimini faollashtirib, genetik mutatsiyalarni keltirib chiqaradi.", "Hujayralararo aloqalarni uzadi, bu esa umumiy organizmning moslashishini cheklaydi.", "Organizmning funksional tizimlarida buzilishlarni keltirib chiqarib, maladaptiv holatga olib keladi."], ["Issiqlik shok oqsillari (HSP) adaptasiyada qanday muhim mexanizmni bajaradi va ularning asosiy funksiyasini tushuntiring?", "Boshqa oqsillarning toʻgʻri burmalanishini ta'minlab, ularni denaturasiyadan himoya qiladi.", "Hujayralarning kislorod iste'molini kamaytiradi va energiya ishlab chiqarishni sekinlashtiradi.", "Faqat sovuq stressiga javoban ishga tushadi, hujayra membranalarining oʻtkazuvchanligini oshiradi.", "DNK replikatsiyasini toʻxtatib, hujayra boʻlinishini sekinlashtiradi va genetik assimilyatsiyaga yordam beradi."], ["Gipoksiya-indusirlanuvchi omil (HIF-1) tizimi kislorod yetishmovchiligi sharoitida qanday faollashadi va qanday genlarning ekspressiyasini boshqaradi?", "Kislorod yetishmovchiligi sharoitida faollashib, eritropoetin va VEGF kabi genlarni boshqaradi.", "Faqat kislorod miqdori oshganda faollashib, insulin va glyukagon genlari ekspressiyasini oshiradi.", "Tashqi haroratning oʻzgarishiga javoban faollashadi, ter bezlari genlarining sintezini oshiradi.", "Hujayralarda yogʻ kislotalari sintezini boshqaradi va gemoglobin miqdorini kamaytiradi, qon aylanishini sekinlashtiradi."], ["Issiq iqlimga morfologik adaptasiya Bergman va Allen qoidalariga koʻra qanday namoyon boʻladi, uning xususiyatlarini izohlang?", "Bergman: kichikroq tana; Allen: uzunroq tana a'zolari, samarali issiqlik chiqarish.", "Bergman: kattaroq tana; Allen: kalta tana a'zolari, issiqlik saqlashga yordam beradi.", "Bergman: ingichka tana; Allen: qisqa oyoq-qoʻllar, energiyani tejash uchun qulaylik beradi.", "Bergman: oʻzgarishsiz tana hajmi; Allen: tana a'zolari doimiy uzunlikda, haroratga bogʻliq emas."], ["Maladaptasiya nima va organizm uchun qanday salbiy oqibatlarga olib kelishi mumkin, uning oldini olish choralari haqida tushuntiring?", "Organizmning notoʻgʻri yoki yetarli boʻlmagan javobi boʻlib, funksional buzilishlarga sabab boʻladi; bosqichma-bosqich adaptasiya zarur.", "Organizmning sharoitlarga toʻliq moslashishi natijasida yuzaga keladigan holat boʻlib, hech qanday salbiy oqibatlarga olib kelmaydi, stressni oshirish kerak emas.", "Adaptiv mexanizmlar haddan tashqari faollashganda yuzaga keladigan holat, bu esa immunitetning kuchayishiga olib keladi va davolash talab qilinmaydi.", "Genetik mutatsiyalar tufayli organizmning yanada yaxshi moslashish qobiliyatini ifodalaydi, shuning uchun stress omilini keskin oshirish tavsiya etiladi."], ["Adaptasiya (moslashish) tushunchasining fiziologik asoslardagi eng aniq ta'rifi qaysi javobda to'g'ri ifodalangan?", "Organizmning oʻzgaruvchan tashqi muhit sharoitlariga moslashib, ichki muhit doimiyligini saqlash qobiliyati.", "Tirik organizmlarning faqat genetik oʻzgarishlar orqali yangi sharoitlarga moslashish jarayoni.", "Tashqi muhit omillari ta'sirida organizm funksiyalarining vaqtinchalik buzilishi va tiklanishi.", "Hujayralar darajasida sodir bo'ladigan, organizmning energiya sarfini doimiy ravishda oshiruvchi jarayon."], ["Zamonaviy fiziologik tadqiqotlarga koʻra, adaptasiya jarayonining uchta asosiy fazasi qanday nomlanadi va ular qaysi tartibda amalga oshadi?", "Moslashuv (adjustment), transduksiya (transduction) va toʻliq adaptasiya (adaptation) bosqichlari.", "Akklimatizasiya, genetik assimilyasiya hamda kompensasiya deb ataluvchi uchta asosiy faza.", "Dastlabki reaksiyalar, metabolik oʻzgarishlar va morfologik tuzilmalarning oʻzgarish bosqichlari.", "Stress javob, gormonal regulyasiya va funksional tizimlar optimallashuvi kabi uch bosqich."], ["Adaptasiyaning birinchi fazasi – moslashuv (adjustment) – organizmning stress omiliga qanday dastlabki javob reaksiyalari bilan tavsiflanadi?", "Zudlik bilan himoya mexanizmlarining ishga tushishi, masalan, ter ajralishi yoki titrash boshlanishi.", "Hujayralarda issiqlik shok oqsillari (HSP) sintezining faollashishi va gen ekspressiyasi oʻzgarishi.", "Stress reaksiyalari to'liq susayib, funksional tizimlarning yangi sharoitda samarali ishlay boshlashi.", "Organizmning ichki muhit doimiyligini to'liq tiklash va energiya sarfini maksimal darajada oshirish."], ["Adaptasiya jarayonining uchinchi fazasi, ya'ni toʻliq adaptasiya (adaptation) qanday natijalar bilan tavsiflanadi?", "Stress reaksiyalari susayib, energiya sarfi optimallashadi va funksional tizimlar samarali ishlaydi.", "Hujayra darajasida molekulyar mexanizmlarning endigina faollashish bosqichi boshlanadi.", "Organizmning stress omiliga nisbatan tezkor va qisqa muddatli himoya javoblari sodir bo'ladi.", "Ichki muhit doimiyligi hali to'liq ta'minlanmagan holatda bo'lib, noqulayliklar saqlanadi."], ["Gipoksiya-indusirlanuvchi omil (HIF-1) tizimining faollashuvi kislorod yetishmovchiligi sharoitida qanday asosiy jarayonlarni boshqaradi?", "Eritropoetin va vaskulyar endotelial o'sish omili (VEGF) kabi genlar ekspressiyasini boshqarib, qon hosil boʻlishini rag'batlantiradi.", "Issiqlik shok oqsillari (HSP) sintezini to'xtatib, hujayralarda metabolik jarayonlarni sekinlashtiradi.", "Buyrak usti bezlaridan adrenalin ajralishini kamaytirib, yurak urish tezligini pasaytiradi.", "Teri qon tomirlarining kengayishini kuchaytirib, issiqlik yo'qotilishini oshirishga yordam beradi."], ["Uzoq muddatli stress ta'sirida adaptasiyaning epigenetik mexanizmlari qanday oʻzgarishlar orqali gen ekspressiyasiga ta'sir koʻrsatadi?", "Giston oqsillarining post-translatsion modifikatsiyalari va DNK metillanishi kabi o'zgarishlar gen ekspressiyasini uzoq muddat o'zgartiradi.", "Faqatgina qisqa muddatli stress ta'sirida genetik o'zgarishlarga olib keladi, uzoq muddatli ta'siri yo'q.", "Genlarning strukturaviy tuzilishini doimiy o'zgartirib, yangi genlarning sintezlanishini rag'batlantiradi.", "Hujayralarda energiya ishlab chiqarish jarayonlarini to'xtatib, metabolik jarayonlarning pasayishiga olib keladi."], ["Issiq iqlimga moslashgan odamlarda ter ajralishining kuchayishi bilan bog'liq qanday oʻzgarishlar kuzatiladi?", "Ter bezlari kattalashadi, koʻproq ter ishlab chiqariladi va ter tarkibida elektrolitlar konsentrasiyasi kamayadi.", "Ter bezlari faoliyati pasayib, suv va tuzlarning organizmda saqlanib qolishi ta'minlanadi.", "Teri yuzasidagi qon tomirlarining torayishi hisobiga ter ajralishi kamayadi, ichki organlar himoyasi kuchayadi.", "Ter ajralishi kamayib, tananing issiqlik ishlab chiqarish qobiliyati sezilarli darajada ortadi."], ["Issiq sharoitlarda odam organizmida qon aylanish tizimida qanday adaptiv oʻzgarishlar sodir bo'ladi?", "Teri qon tomirlari kengayadi, teriga qon oqimi kuchayadi va yurak urish tezligi ortadi.", "Ichki organlarga qon oqimi sezilarli darajada oshadi, teri qon tomirlari esa torayadi.", "Qon aylanish tezligi pasayib, yurak urish tezligi sekinlashadi, bu energiya tejashga olib keladi.", "Qon bosimi keskin oshadi va periferik tomirlar torayib, issiqlik yo'qotilishini kamaytiradi."], ["Issiq iqlimga moslashgan odamlarda moddalar almashinuvi va morfologik adaptasiyaga oid qaysi xususiyatlar toʻgʻri berilgan?", "Bazal metabolizm tezligi past boʻladi; Bergman va Allen qoidalariga koʻra tana oʻlchami kichik, a'zolari uzunroq.", "Bazal metabolizm tezligi yuqori boʻladi; tana oʻlchami katta, a'zolari esa qisqaroq boʻladi.", "Moddalar almashinuvi oʻzgarmaydi; tana shakli va oʻlchamlari iqlim sharoitlariga bog'liq emas.", "Organizmdagi energiya ishlab chiqarish kuchayadi; terining yog' qatlami qalinlashishi bilan izolyasiya oshadi."], ["Uzoq muddatli sovuq adaptasiyasida titramas issiqlik hosil qilish (non-shivering thermogenesis) jarayonida qaysi organlar va moddalar muhim rol o'ynaydi?", "Jigarda va jigʻar yog' toʻqimasida issiqlik ishlab chiqarish kuchayadi, noradrenalin muhim rol o'ynaydi.", "Suyak iligida qizil qon tanachalari ishlab chiqarilishi kuchayadi, bu kislorod tashilishini oshiradi.", "Buyraklarda kortizol sintezining oshishi orqali organizmning stressga qarshiligini mustahkamlaydi.", "Teri osti yog' qatlamining yupqalashishi hisobiga issiqlik yo'qotilishining ortishi kuzatiladi."], ["Sovuq ta'sirida periferik qon tomirlarining torayishi organizmda qanday adaptiv ahamiyatga ega?", "Teriga qon oqimini kamaytirib, tana ichki organlarini sovuqdan himoya qiladi va issiqlik yo'qotilishini kamaytiradi.", "Teriga qon oqimini oshirib, issiqlikni tashqi muhitga samarali chiqarishni ta'minlaydi.", "Ichki organlarning metabolik faolligini oshirib, qo'shimcha issiqlik ishlab chiqarilishiga yordam beradi.", "Qon bosimini pasaytirib, yurakning yuklamasini kamaytiradi va energiya tejashni ta'minlaydi."], ["Baland tog' sharoitidagi gipoksiyaga javoban organizmda nafas olish tizimida qanday adaptiv oʻzgarishlar kuzatiladi?", "Nafas tezligi va chuqurligi ortadi, bu qondagi kislorod miqdorini oshirishga qaratilgan.", "Nafas tezligi va chuqurligi kamayadi, bu energiya sarfini minimallashtirishga xizmat qiladi.", "O'pka alveolalarida havo almashinuvi kamayadi, qonda CO₂ miqdori oshadi.", "Nafas olish tizimining faoliyati o'zgarmaydi, organizm boshqa mexanizmlar orqali moslashadi."], ["Adaptasiya jarayonining individual (fenotipik) va populyasiya (genetik) darajalardagi turlari qanday xususiyatlar bilan ajralib turadi?", "Individual adaptasiya organizmning hayoti davomida shakllanadi (akklimatizasiya), populyasiya darajasidagi adaptasiya esa avlodlar davomida tabiiy tanlanish natijasida shakllanadi.", "Individual adaptasiya genetik o'zgarishlarga bog'liq bo'lib, irsiy belgilar orqali avloddan avlodga o'tadi, populyasiya adaptasiyasi esa qisqa muddatli.", "Har ikkala adaptasiya turi ham bir xil mexanizmlar orqali sodir bo'ladi va ularning o'rtasida hech qanday farq yo'q.", "Populyasiya adaptasiyasi faqatgina atrof-muhit omillariga to'g'ridan-to'g'ri javob berish bilan cheklangan, individual adaptasiya esa universaldir."], ["Dastlabki (birlamchi) tibbiy tekshiruv sport tibbiyotida qachon oʻtkazilishi lozimligi belgilangan?", "Sport bilan shug'ullanishni boshlashdan oldin sport turini tanlash va ruxsat berish uchun.", "Mashg'ulot jarayonida muntazam ravishda sportchining tayyorgarlik dinamikasini kuzatish maqsadida.", "Kasallik yoki jarohatdan keyin, uzoq tanaffusdan so'ng mashg'ulotga qaytish oldidan.", "Sportchi organizmining yuklamaga tezkor javobini baholash uchun bevosita mashq paytida."], ["Shaxsiy anamnez yig'ishda sportchidan jismoniy yuklama paytida qaysi belgilar so'ralishi kerak?", "Koʻkrak qafasidagi og'riq yoki noqulaylik, sababsiz hushdan ketish yoki hansirash holatlari.", "Uyqu sifati, kundalik ovqatlanish ratsioni va tana vaznining so'nggi o'zgarishlari haqida.", "So'nggi olti oy ichida yuzaga kelgan teri toshmalari va allergiya reaksiyalari bo'yicha.", "Ko'rish o'tkirligi, eshitish qobiliyati va tishlar holatidagi kuzatilgan o'zgarishlar haqida."], ["Marfan sindromining belgilari fizikal koʻrikda qanday tashqi ko'rinishlar bilan namoyon boʻladi?", "Baland boʻy, uzun qo'l-oyoq va barmoqlar, koʻkrak qafasi deformatsiyasi kabi tashqi ko'rinishlar.", "Mushak kuchining pasayishi, bo'g'imlarning harakatchanligining cheklanishi va og'riq sindromi.", "Teri osti yog' qatlamining ko'payishi, pigmentatsiya buzilishlari va soch to'kilishi hollari.", "Ko'z o'tkirligining pasayishi, rang ajratish qobiliyatining buzilishi va eshitishning pasayishi."], ["Tayanch-harakat apparati koʻrigida sportchining qaysi ko'rsatkichlari baholanadi?", "Qomat, umurtqa pog'onasi, boʻgʻimlar harakatchanligi, mushaklar kuchi va simmetriyasi.", "Yurak ritmining buzilishlari, qon bosimining o'zgarishi va nafas olish tezligi ko'rsatkichlari.", "Nerv tizimining reflekslari, sezgirligi va koordinatsiyasining holati va darajasi.", "Ovqat hazm qilish tizimining faoliyati, jigar va buyraklar hajmining o'zgarishi darajasi."], ["Yosh sportchilarda to'satdan yurak o'limining asosiy sabablari sifatida qaysilar ko'rsatiladi?", "Gipertrofik kardiomiopatiya, aritmogen oʻng qorincha kardiomiopatiyasi, toj arteriyalari anomaliyalari.", "Qandli diabet, bronxial astma va buyrak usti bezlari patologiyalari bilan bog'liq holatlar.", "Umumiy shamollash, gripp kabi virusli infeksiyalar va bakterial pnevmoniya kasalliklari.", "Miya qon aylanishining buzilishi, insult va boshqa serebrovaskulyar kasalliklar holati."], ["Yevropa kardiologlar jamiyati sportchilarni skrining qilishda qaysi usullar kombinatsiyasini tavsiya etadi?", "Anamnez, fizikal koʻrik va 12 tarmoqli EKGni birgalikda qoʻllash usullarini tavsiya etadi.", "Faqatgina rentgenografik tekshiruvlar va qon tahlillarining keng qamrovli paketi asosida.", "Faqatgina spirometriya va dinamometriya kabi jismoniy rivojlanish ko'rsatkichlarini o'lchash.", "Psixologik baholash va sportchining ruhiy holatini aniqlashga qaratilgan testlar asosida."], ["Sportchilarda muntazam mashq natijasida EKGda kuzatiladigan fiziologik o'zgarishlarga qaysilar kiradi?", "Sinusli bradikardiya, chap qorincha kuchlanishi mezonlarining alohida oshishi kabi o'zgarishlar.", "Qon plazmasidagi xolesterin darajasining keskin ko'payishi va lipid profili buzilishlari.", "Qon bosimining doimiy yuqori ko'rsatkichlari va yurak ritmining to'liq buzilishi holatlari.", "Qandli diabetning boshlang'ich belgilari va insulin qarshiligining rivojlanishi holati."], ["EKGda shubhali holatlar aniqlanganda, kardiolog qanday qoʻshimcha tekshiruvlarni buyurishi mumkin?", "Exokardiografiya, yuklama testi va Holter monitoringi kabi tekshiruvlarni buyurishi mumkin.", "Kompyuter tomografiya (KT) va magnit-rezonans tomografiya (MRT) tekshiruvlarini buyurishi.", "Endoskopik tekshiruvlar va biopsiya orqali ichki a'zolar holatini baholash usullarini.", "Allergiya testlari va immunologik tahlillar orqali organizmning himoya qobiliyatini aniqlash."], ["Martine-Kushelevskiy sinamasida tekshiriluvchi shaxs qanday harakatlarni bajarishi kerakligi belgilangan?", "30 soniyada 20 marta oʻtirib-turadi, so'ngra yurak urishi va arterial bosim oʻzgarishi baholanadi.", "Bir daqiqada maksimal tezlikda yugurib, so'ngra yurak urish tezligi va nafas olishni o'lchash.", "Belgilangan og'irlikdagi yuklarni ko'tarib, mushaklarning chidamliligini va kuchini aniqlash.", "Bir oyog'ida turib, muvozanatni saqlab turish va tana og'irligini taqsimlashni baholash."], ["Tibbiy tekshiruv natijalariga ko'ra sportchiga qanday ruxsat turlari berilishi mumkin?", "Cheklovsiz ruxsat, qoʻshimcha tekshiruv yoki davolash tavsiyasi bilan ruxsat, ayrim sport turlari uchun ruxsat.", "Faqatgina professional sport musobaqalarida ishtirok etishga ruxsat, havaskor sport turlari uchun cheklovlar.", "Faqatgina qisqa muddatli mashg'ulotlarga ruxsat, uzoq muddatli sport faoliyatiga cheklovlar bilan.", "Barcha jismoniy yuklamalardan to'liq ozod qilish va sport faoliyatini butunlay taqiqlash buyrug'i."], ["Olingan ma'lumotlar murabbiyga yuklamani individual rejalashtirishda qanday yordam beradi?", "Sportchining jismoniy imkoniyatlari va tiklanish resurslarini hisobga olgan holda mashg'ulotlarni optimallashtirish.", "Sportchining kelajakdagi sport karyerasini prognoz qilish va uning moliyaviy imkoniyatlarini baholash.", "Sportchining shaxsiy hayoti va oilaviy munosabatlariga oid maslahatlar berishda yordam beradi.", "Sportchining raqobatbardoshligini oshirish uchun noqonuniy doping vositalarini tavsiya etish."], ["Tibbiy tekshiruvning cheklovlari nimadan iboratligi matnda ko'rsatilgan?", "Hech bir skrining usuli barcha xavfli holatlarni aniqlay olmaydi va notoʻgʻri musbat natijalar yuzaga kelishi mumkin.", "U faqat professional sportchilarga mo'ljallangan va havaskorlar uchun hech qanday ahamiyatga ega emas.", "Juda murakkab uskunalar va yuqori malakali mutaxassislar talab qilgani sababli juda qimmatdir.", "Sportchining shaxsiy ma'lumotlarini himoya qilish qoidalariga zid kelgani uchun amalda kam qo'llaniladi."], ["Agar mashg'ulot paytida sportchida ko'krak og'rig'i yoki hushdan ketish kabi belgilar paydo bo'lsa, murabbiy yoki jismoniy tarbiya o'qituvchisi nima qilishi kerak?", "Mashqni darhol to'xtatib, tibbiy yordam chaqirishi lozimligi matnda ta'kidlangan.", "Sportchini tezda suv ichishga majburlab, mashg'ulotni davom ettirishga undash kerak.", "Sportchining o'z-o'zidan tiklanishini kutib, hech qanday aralashuvsiz kuzatib turish kerak.", "Sportchini shaxsiy mashg'ulot rejasiga rioya qilishga majburlab, jarohatni e'tiborsiz qoldirish."], ["Sportchi salomatligini tekshirishning asosiy vazifalaridan biri qaysi?", "To'satdan o'limga olib kelishi mumkin bo'lgan yurak-qon tomir kasalliklarini aniqlash.", "Sportchilarning musobaqa jadvalini va sayohat marshrutini to'liq rejalashtirish.", "Sportchining kelajakdagi sport yutuqlarini oldindan bashorat qilish.", "Sportchiga maxsus moliyaviy yordam ko'rsatish dasturlarini tuzish."], ["Xalqaro Olimpiya qo'mitasining 2009-yilgi konsensus bayonotiga ko'ra, elita sportchilarining davriy tibbiy baholanishi nimani o'z ichiga oladi?", "Anamnez, fizikal koʻrik, yurak-qon tomir va tayanch-harakat tizimlarini baholash.", "Sportchining shaxsiy murabbiyi bilan intervyu va media-tadqiqotlarni o'z ichiga oladi.", "Faqat sportchining o'tgan musobaqa natijalarini va jarohatlar tarixini ko'rib chiqish.", "Sportchining reklama shartnomalari va moliyaviy ahvolini baholash."], ["Sportchi salomatligini tekshirishning eng muhim va eng arzon qismi sifatida qaysi usul tan olinadi?", "Anamnez (so'rov), bu sportchidan olingan shaxsiy va oilaviy tibbiy ma'lumotlarni o'z ichiga oladi.", "Fizikal koʻrik, bu tana a'zolarining vizual va palpator tekshiruvini qamrab oladi.", "Laborator tahlillar, bu qon, siydik va boshqa biologik suyuqliklarning kimyoviy analizini o'z ichiga oladi.", "Yurak-qon tomir skriningi, bu elektrokardiogramma va boshqa kardio-diagnostik usullarni o'z ichiga oladi."], ["Shaxsiy anamnez yig'ish jarayonida jismoniy yuklama paytida ko'krak qafasidagi og'riq yoki noqulaylik haqida ma'lumot so'rash nimani aniqlashga qaratilgan?", "Ehtimoliy yurak-qon tomir kasalliklari belgilarini o'rganish.", "Sportchining ovqatlanish ratsionidagi kamchiliklarni baholash.", "Mushak og'rig'i sindromlarining sabablarini aniqlash.", "Uzoq muddatli uyqusizlikning umumiy ta'sirini tekshirish."], ["Oilaviy anamnezda 50 yoshgacha yaqin qarindoshlarning yurak kasalligi tufayli to'satdan vafot etishi haqida so'rash, ayniqsa qaysi kasalliklarning borligini aniqlashga yordam beradi?", "Gipertrofik kardiomiopatiya, uzaygan QT sindromi, Marfan sindromi.", "Bronxial astma, qandli diabet va surunkali oshqozon-ichak kasalliklari.", "O'pkaning surunkali obstruktiv kasalligi va buyrak yetishmovchiligi.", "Revmatoid artrit, tizimli qizil yuguruk va boshqa autoimmun kasalliklar."], ["Yosh sportchilarda to'satdan yurak o'limining asosiy sabablari sifatida quyidagi kasalliklardan qaysi biri keltirilgan?", "Gipertrofik kardiomiopatiya, aritmogen oʻng qorincha kardiomiopatiyasi va uzaygan QT sindromi.", "Surunkali bronxit, o'pka emfizemasi va boshqa nafas yo'llari tizimining obstruktiv kasalliklari.", "Qandli diabetning turli shakllari, uning asoratlari hamda gipoglikemik holatlarning muntazam takrorlanishi.", "Buyrak yetishmovchiligi, surunkali gepatit kasalliklari va oshqozon-ichak tizimi patologiyalari."], ["Italiyada 1982-yildan beri musobaqalarda qatnashuvchi sportchilar uchun majburiy skrining dasturi nimani o'z ichiga oladi?", "Elektrokardiogramma (EKG) tekshiruvini.", "Faqat jismoniy rivojlanish ko'rsatkichlarini baholashni.", "Ruhiy holatni chuqur psixologik tahlil qilishni.", "Oziqlanish ratsionini va uyqu rejimini baholashni."], ["Funksional sinamalarning asosiy maqsadi nima, ya'ni ular tashxis vositasi emas, balki nimani baholash usulidir?", "Organizmning yuklamaga javobini baholash.", "Kasalliklarni aniq tashxislash va ularning og'irlik darajasini belgilash.", "Sportchining ijtimoiy moslashuvchanligi va jamoaviy ruhini o'lchash.", "Genetik moyillikni va irsiy kasalliklarning mavjudligini aniqlash."], ["Sportchi salomatligini tekshirishning ahamiyati bir necha jihatda namoyon boʻladi. Jarohatlarning oldini olish dasturlarini tuzishga qanday yordam beradi?", "Tayanch-harakat apparatidagi zaif bo'g'inlarni aniqlash orqali.", "Sportchining musobaqa natijalarini to'g'ri bashorat qilish orqali.", "Murabbiylar uchun o'quv dasturlarini tayyorlash orqali.", "Sportchining ijtimoiy hayotini yaxshilash orqali."], ["Sport jarohatlari deganda jismoniy mashqlar yoki musobaqalar davrida yuzaga keladigan qanday shikastlanish tushuniladi?", "Organizmdagi to'qimalarning tashqi yoki ichki omillar ta'sirida shikastlanishi bilan bog'liq holatdir.", "Faqatgina suyak tizimidagi jarohatlar natijasida paydo bo'ladigan og'riqli sindrom hisoblanadi.", "Ushbu holat faqat mushaklar va boylamlarning to'satdan zo'riqishi oqibatida yuzaga keladigan shikastlanishdir.", "Sportchining ruhan charchashi natijasida yuzaga keladigan va jismoniy faoliyatga ta'sir qiladigan holatdir."], ["Sport jarohatlari kelib chiqish mexanizmiga ko'ra zamonaviy sport tibbiyotida qaysi uchta asosiy toifaga ajratiladi?", "Ortiqcha yuklanish, to'g'ridan-to'g'ri zarba natijasidagi va o'tkir yumshoq to'qima jarohatlari turlari.", "Yuqori harorat, past harorat ta'siridan yuzaga kelgan va uzoq muddatli yallig'lanishdan kelib chiqqan jarohatlar.", "Nerv tizimining shikastlanishi, ichki organlarning disfunksiyasi va suyak iligining zararlanishi oqibati.", "Mexanik ta'sir, kimyoviy kuyishlar va ultrabinafsha nurlarining salbiy ta'siridan kelib chiqqan jarohatlar."], ["RICE/PRICE protokolining 'Dam olish' (Rest) qismi jarohatni boshqarishda qanday rol o'ynaydi?", "Jarohatlangan sohaga qo'shimcha zarar yetkazilishining oldini oladi va tanaga tiklanish imkonini beradi.", "Mushaklar faoliyatini maksimal darajada rag'batlantirish va jarohatlangan a'zoni tez-tez harakatlantirishdir.", "Faqatgina jarohatlangan a'zoni mutlaq harakatsiz holatda saqlashni ta'minlashdan iboratdir.", "Og'riqni e'tiborsiz qoldirib, jarohatga qaramay, mashg'ulotlarni davom ettirishga undash vazifasidir."], ["Muz yoki sovuq paketni jarohatlangan sohaga to'g'ri qo'llash qoidalariga nimalar kiradi?", "Muzni teriga to'g'ridan-to'g'ri qo'ymasdan matoga o'rash, 15-20 daqiqa ushlab turish, so'ngra tanaffus qilish.", "Muzni to'g'ridan-to'g'ri teriga kamida 40-50 daqiqa davomida qo'llash, chunki bu sovuq terapiyaning eng samarali usulidir.", "Muzni jarohatlangan joyga faqat 48 soatdan keyin qo'llash, chunki dastlabki bosqichda issiqlik talab qilinadi.", "Muz paketini har 3-4 soatda tekshirib, uni har doim yangilab turish, harakatsiz holatda saqlash tavsiya etiladi."], ["Jarohatdan keyingi dastlabki 48 soat ichida issiqlik qo'llashdan nima uchun voz kechish kerak?", "Issiqlik qon tomirlarini kengaytirib, shishishni kuchaytiradi, bu esa jarohatning yomonlashishiga olib keladi.", "Issiqlik og'riq sezgilarini to'liq bloklaydi, bu holat jarohatning og'irligini to'g'ri baholashga xalaqit beradi.", "Issiqlik mushaklarning kuchayishiga olib keladi va bu jarohatlangan sohada harakat cheklovlarini yuzaga keltiradi.", "Issiqlik bakterial infeksiyalarning rivojlanishiga imkon yaratadi, bu esa tiklanish jarayonini sekinlashtiradi."], ["Kompressiya (Compression) jarohatlangan sohada shishishni kamaytirish va bo'g'imga tayanch berish uchun qanday ishlatiladi?", "Elastik bint bilan siqish orqali qon va limfa oqimini me'yorlashtiradi, suyuqlik to'planishining oldini oladi.", "Jarohatlangan sohada qon aylanishini to'liq to'xtatish orqali og'riqni kamaytiradi va asab tugunlarini izolyatsiya qiladi.", "Bu mushaklarning zo'riqishini oshiradi va to'qimalarning metabolik jarayonlarini sezilarli darajada tezlashtiradi.", "Jarohatlangan joyni harakatsizlantirishni ta'minlaydi va umumiy tana haroratini barqarorlashtirishga yordam beradi."], ["Elastik bint bilan kompressiya qo'llashda qanday holatlarda bintni bo'shashtirish zarur?", "Agar bog'langan sohada uyushish, qichishish yoki barmoqlar rangi o'zgarishi (ko'karishi, oqarishi) kuzatilsa.", "Bint qisman sirpanib tushsa yoki jarohatlangan sohada engil og'riq sezgisi paydo bo'lsa, bo'shashtiriladi.", "Agar bint qo'llangandan keyin 2-3 soat o'tgach shishish to'liq yo'qolsa, u holda uni bo'shatish kerak bo'ladi.", "Faqatgina bint qattiq bog'langanidan so'ng faol harakatlanish imkoniyati to'liq tiklansa, bo'shatish lozim."], ["Jarohatlangan a'zoni ko'tarish (Elevation) usuli shishishni kamaytirishda qanday samarali hisoblanadi?", "Tortishish kuchi ta'sirida suyuqlikning jarohat sohasidan markazga qarab oqishini osonlashtiradi.", "Bu usul asosan mushaklarning kuchlanishini oshirish va qon tomirlarining kengayishiga yordam beradi, bu shishni kamaytiradi.", "Qon aylanishini to'liq to'xtatib, og'riqni kamaytirish va jarohatlangan joyni mutlaq harakatsizlantirishga qaratilgan.", "Jarohatlangan a'zoga bosimni kamaytirish va organizmning umumiy metabolizmini tezlashtirish uchun qo'llaniladi."], ["Ko'karishlar (gematoma)da birinchi yordam ko'rsatishning asosiy qoidalari qanday amalga oshiriladi?", "Darhol sovuq qo'llash, so'ngra elastik bint bilan kompressiya qilish va jarohatlangan sohani harakatsiz saqlash.", "Jarohatlangan joyni tez-tez massaj qilish va issiqlik kompresslari qo'llash orqali qon aylanishini faollashtirish.", "Antiseptik eritmalarni ishlatib, jarohatni darhol dezinfeksiya qilish va keyin harakatlanishni davom ettirish.", "Qonashni to'liq to'xtatish uchun bintni juda qattiq bog'lash va og'riq qoldiruvchi dorilarni darhol ichish tavsiya etiladi."], ["Suyak sinishida yoki bo'g'im chiqishida birinchi yordam ko'rsatishda qaysi harakat qat'iyan taqiqlanadi?", "Suyakni o'z-o'zidan joyiga solishga urinish yoki bo'g'imni mustaqil ravishda qayta joylashga harakat qilish.", "Jarohatlangan sohada muz qo'llash va uni elastik bint bilan qattiq bog'lash orqali shishishni kamaytirishdir.", "Jarohatlangan a'zoni to'liq harakatsiz holatda saqlash va tez yordam xizmatini darhol chaqirish zarurati.", "Ochiq sinishda steril bog'lam qo'llash va atrofdagi terini dezinfeksiya qilish bilan to'g'ri bog'lashni ta'minlash."], ["Burun qonashida birinchi yordam ko'rsatishda qanday noto'g'ri harakatdan saqlanish va nimalar qilish tavsiya etiladi?", "Boshni orqaga tashlamaslik, aksincha oldinga egib, burun teshigiga sovuq qo'llash va tampon qo'yish.", "Boshni orqaga tashlab, yotgan holatda qonni yutish va burun teshigini barmoqlar bilan qattiq siqib turish.", "Burunni issiq suv bilan yuvish va uni yengil massaj qilish orqali qon aylanishini tezlashtirishga urinish.", "Boshni yuqoriga ko'tarib, burun teshigiga to'g'ridan-to'g'ri antiseptik eritma tomizish va faol harakat qilish."], ["Quyidagi belgilardan qaysi biri jarohatlangan sportchiga zudlik bilan tibbiy yordam chaqirish zarurligini ko'rsatadi?", "A'zo yoki bo'g'imning shakli o'zgargan bo'lsa, kuchli og'riq va tez rivojlanayotgan shishish kuzatilsa.", "Jarohatlangan sohada biroz qichishish, yengil og'riq va shishishning sekin rivojlanishi mavjud bo'lsa.", "Sportchi jarohatga qaramay, mustaqil harakatlana olsa va uning kayfiyati ko'tarinki ruhda bo'lsa.", "Faqatgina terida kichik tirnalishlar yoki chuqur bo'lmagan ko'karishlar paydo bo'lsa, tez yordam talab qilinadi."], ["Sport jarohatlarining oldini olish bo'yicha asosiy choralardan biri bo'lgan 'To'g'ri isinish' qanday ahamiyatga ega?", "Mashg'ulotdan oldin 10-15 daqiqa dinamik mashqlar bajarish, chunki sovuq mushaklar jarohatga moyil bo'ladi.", "Sport faoliyatini to'xtatish va jarohatlangan sohada mutlaq harakatsizlikni ta'minlash muhimligini anglatadi.", "Faoliyatni boshlashdan oldin mushaklarni sovitish, bu ularning chidamliligini oshirishga yordam beradi deb tushuniladi.", "Har qanday intensivlikdagi jismoniy mashqni to'g'ridan-to'g'ri boshlash va qizib olmasdan darhol sportga kirishishdir."], ["Sport jarohatlarining oldini olishda to'g'ri isinishning (warm-up) asosiy ahamiyati qanday?", "Sovuq mushaklarni jarohatga kamroq moyil qilish uchun dinamik mashqlar bajarish.", "Mashg'ulotdan oldin sportchining tezlik va chidamliligini oshirishga yordam berish.", "Mushaklar hajmini oshirib, jismoniy faoliyat samaradorligini sezilarli darajada oshirish.", "Jarohatdan keyingi tiklanish jarayonini tezlashtirish va og'riqni kamaytirish."], ["Suyak sinishida birinchi yordamning eng asosiy maqsadi nima hisoblanadi?", "Suyakni harakatsiz holatda saqlash va qo'shimcha zararning oldini olishdir.", "Sinish joyiga tezda issiq kompress qo'yish orqali og'riqni kamaytirish usuli.", "Suyakni o'z-o'zidan to'g'ri joyiga solishga harakat qilish majburiyati.", "Jarohatlangan hududni massaj qilish orqali qon aylanishini yaxshilash."], ["Ortiqcha yuklanish jarohatlari qanday mexanizm orqali yuzaga keladi?", "Mushaklar, paylar, tog'aylar va suyaklarga takroriy, uzoq muddatli bosim natijasida.", "To'g'ridan-to'g'ri zarba yoki to'qnashuvlar oqibatida to'qimalarning shikastlanishi.", "To'satdan kuchli zo'riqishlar natijasida pay va mushaklarning uzilishi yuzasidan.", "Sportchining noto'g'ri ovqatlanishi va yetarli dam olmasligi sababli yuzaga keladi."], ["Kompressiya bintini juda qattiq bog'lashdan nima uchun saqlanish kerak?", "Qon aylanishini buzishi va uyushish, qichishish kabi asoratlar keltirib chiqarishi.", "Bu jarohatlangan hududda shishishni kuchaytirishi va og'riqni oshirishi mumkinligi.", "Bintning o'zi terini bezovta qilib, qo'shimcha teri jarohatlariga sabab bo'lishi.", "Juda qattiq bint mushaklarning harakatchanligini cheklab, tiklanishni sekinlashtirishi."], ["Sport bilan shug'ullanuvchi shaxslar uchun gigiyena qoidalariga rioya qilishning qanday ahamiyati bor?", "Shikastlanishning oldini olish va sog'liqni saqlash hamda mashg'ulot samaradorligini oshirish.", "Mashg'ulotlar paytida atletik ko'rsatkichlarni darhol oshirish va tezlikni yaxshilash.", "Faqat sport inshootlarining estetik holatini ta'minlash va tozaligini saqlash uchun.", "Boshqa sportchilar bilan raqobatda ustunlikka erishish uchun majburiy talab."], ["Boylamlarning cho'zilishi (sprain) va mushaklarning uzilishi (strain) o'rtasidagi asosiy farq nima?", "Cho'zilish boylamlarning shikastlanishi bo'lsa, uzilish mushaklarning shikastlanishidir.", "Cho'zilish suyaklarning yorilishi, uzilish esa bo'g'imlarning joyidan siljishi hisoblanadi.", "Cho'zilish faqat to'g'ridan-to'g'ri zarbadan yuzaga kelsa, uzilish ortiqcha yuklanishdan keladi.", "Cho'zilish qon tomirlarining yorilishi, uzilish esa terining shikastlanishidir."], ["Ko'karishlar (gematoma) paytida birinchi yordam sifatida darhol sovuq qo'llashning asosiy sababi nima?", "Qon oqimini sekinlashtirish va gematomaning kengayishini oldini olish uchun.", "Qon tomirlarini kengaytirib, qonning tezroq so'rilishini ta'minlash maqsadida.", "Jarohatlangan hududni og'riqsizlantirish va tezda tiklanishni boshlash uchun.", "Yallig'lanishga qarshi malhamlarni qo'llashdan oldin terini tayyorlash."], ["Burun qonashida birinchi yordam ko'rsatishda boshni orqaga tashlamaslik nima uchun muhim?", "Boshni orqaga tashlash qonning nafas yo'llariga tushishiga olib kelishi mumkin.", "Boshni orqaga tashlash qon oqimini tezlashtirib, qon yo'qotishni oshiradi.", "Boshning orqaga egilishi burun bo'shlig'ida qon quyilishi xavfini oshiradi.", "Boshni orqaga tashlash og'riqni kuchaytirib, bosh aylanishiga sabab bo'ladi."], ["Tashqi qonashlarda birinchi yordam ko'rsatishning birinchi bosqichi nima?", "Steril doka yoki toza mato bilan jarohat ustiga bosim o'tkazish orqali qonni to'xtatish.", "Jarohatlangan hududni tezda yuqoriga ko'tarish va uni harakatsiz holatda saqlash.", "Jarohatni darhol antiseptik eritma bilan ishlov berish va keyin bog'lashdir.", "Sportchini tinchlantirish va zudlik bilan shifokorga murojaat qilish hisoblanadi."], ["Sport anjomlari va gigiyena vositalarini muntazam tozalashning asosiy maqsadi nimadan iborat?", "Turli mikroorganizmlar, bakteriyalar va zamburug'larning ko'payishining oldini olish va tarqalishini cheklashdir.", "Mashg'ulotlar davomida sportchilarning kiyimlarini yangi holatda saqlash va ularning chidamliligini oshirishdir.", "Anjomlarning estetik ko'rinishini yaxshilash, ularning narxini pasaytirish va tez-tez yangilab turishga ehtiyoj qoldirmaslikdir.", "Sportchilarning jismoniy tayyorgarligini yaxshilash, ularning mashg'ulot samaradorligini doimiy ravishda oshirishdir."], ["Sport gigiyenasi deganda nimani tushuniladi va uning asosiy vazifasi qaysi?", "Sport mashg'ulotlari davomida sog'liqni saqlashga qaratilgan chora-tadbirlar majmuasi hisoblanadi.", "Sportchilarning optimal ovqatlanish rejimini belgilovchi va ularning ratsionini nazorat qiluvchi qoidalaridir.", "Sport inshootlarining faoliyatini tartibga soluvchi, sport tadbirlarini tashkil etish qoidalaridir.", "Jismoniy faoliyat natijasida yuzaga keladigan jarohatlarni davolashga mo'ljallangan bir qator amaliyotlardir."], ["Noto'g'ri yoki yetarli darajada bo'lmagan tozalash natijasida terida qanday noxush holatlar yuzaga kelishi mumkin?", "Terida toshmalar, qichishish, zamburug'li kasalliklar va yiringli yallig'lanishlar paydo bo'lishi ehtimoli bor.", "Terining rangi o'zgarishi, quyosh nurlariga nisbatan sezgirlikning ortishi hamda doimiy quruqlik kuzatilishi mumkin.", "Terining yog' bezlari faoliyatining pasayishi, terlash jarayonining kamayishi va teri elastikligining yo'qolishi.", "Tana haroratining keskin ko'tarilishi, qaltirash holatlari va umumiy holsizlik alomatlari paydo bo'lishi."], ["MRSA (metitsillin-rezistent Staphylococcus aureus) bakteriyasining sport inshootlaridagi tarqalishi qanday amalga oshadi?", "U umumiy anjomlar, sochiqlar va teri orqali bevosita aloqa natijasida yuqishi mumkin.", "U faqatgina havo orqali, ya'ni respirator tomchilar yordamida, aksirish va yo'talish orqali tarqaladi.", "MRSA bakteriyasi asosan ifloslangan suv havzalari orqali, suzish havzalaridagi suzuvchilar orasida yuqadi.", "Bakteriya faqatgina hayvonlardan odamlarga o'tadi, to'g'ridan-to'g'ri odamdan odamga yuqish holatlari kam kuzatiladi."], ["Zamburug'li infeksiyalar, xususan oyoq zamburug'i (mikoz) qanday sharoitlarda tez rivojlanadi?", "Bu infeksiya nam va issiq muhitda juda tez rivojlanish xususiyatiga ega hisoblanadi.", "U sovuq va quruq muhitda, masalan, muzlatilgan anjomlar ustida tezlik bilan ko'payadi.", "Zamburug'lar faqat yorug'lik mavjud bo'lmagan, qorong'u va shamollatilmaydigan joylarda rivojlanadi.", "Uzoq muddatli quyosh nurlari ta'siri ostida, ochiq havoda yuqori haroratda tez o'sadi."], ["Sport anjomlarini tozalashdagi 'Muntazamlik' tamoyili nimani anglatadi?", "Tozalash bir martalik chora emas, balki doimiy jarayon bo'lib, har bir mashg'ulotdan keyin anjomlar tozalanadi.", "Anjomlarni faqatgina jiddiy ifloslangan hollarda, haftada bir marta chuqur tozalashni amalga oshirishdir.", "Tozalashni faqat sport inshooti xodimlari bajarishi kerak, sportchilarning bu jarayonda ishtirok etmasligidir.", "Har bir anjom turini alohida, maxsus belgilangan kunlarda, jadvallarga rioya qilgan holda tozalashdir."], ["Noto'g'ri vositalardan foydalanish sport anjomlariga qanday salbiy ta'sir ko'rsatishi mumkin?", "Anjomning shikastlanishiga yoki tozalash jarayonining samarasiz bo'lishiga olib kelishi mumkin.", "Faqat anjomlarning tashqi ko'rinishini o'zgartiradi, ularning funksionalligiga hech qanday ta'sir qilmaydi.", "Tozalash jarayonini tezlashtiradi, lekin anjomlarning chidamliligini ozgina kamaytirishi mumkin.", "Anjomlarning rangini o'zgartirishi, ularning narxini keskin oshirishi va sotish imkoniyatini pasaytirishidir."], ["Tozalash va dezinfeksiya o'rtasidagi asosiy farq nimada?", "Tozalash - jismoniy iflosliklarni olib tashlash, dezinfeksiya esa mikroorganizmlarni yo'q qilishdir.", "Tozalash kimyoviy moddalar bilan, dezinfeksiya esa faqat issiq suv bilan amalga oshiriladigan jarayondir.", "Dezinfeksiya yuzalarni yaltiratishni, tozalash esa dog'larni yo'qotishni anglatadi.", "Tozalash faqat teri bilan aloqa qiladigan anjomlarga, dezinfeksiya esa barcha turdagi anjomlarga qo'llaniladi."], ["Trenajyor sirtlarini har bir foydalanishdan keyin qanday tozalash tavsiya etiladi?", "Trenajyor sirtlarini dezinfeksiyalovchi vosita bilan artish zarur, ayniqsa qo'l tegadigan qismlarni.", "Trenajyorlarni faqat quruq mato bilan artish kerak, chunki namlik ularning metal qismlarini zanglatishi mumkin.", "Trenajyor sirtlariga faqat maxsus yog'lovchi vositalar surtish tavsiya etiladi, bu ularning uzoq muddat ishlashini ta'minlaydi.", "Trenajyorlarni tozalashda faqat kimyoviy moddalarsiz tabiiy tozalash vositalaridan foydalanish maqsadga muvofiqdir."], ["Boks qo'lqoplari va bandajlarni quritishda qaysi usuldan qochish tavsiya etiladi?", "Qo'lqoplarni to'g'ridan-to'g'ri quyosh nurida quritmaslik kerak, bu materialning yorilishiga olib keladi.", "Ularni faqatgina ochiq havoda, salqin va shamolli joyda quritish tavsiya etiladi, namlik qolmasligi uchun.", "Qo'lqoplarni maxsus quritish uskunalari yordamida, yuqori haroratda quritish maqsadga muvofiqdir.", "Ularni faqat kir yuvish mashinasida, past haroratda quritish kerak, qo'l bilan yuvish tavsiya etilmaydi."], ["Sport poyabzalining ichki qismini tozalash va parvarish qilishda nimalar tavsiya etiladi?", "Muntazam ventilyatsiya qilish va ichki qismini dezinfeksiyalovchi purkagichlar bilan ishlash kerak.", "Poyabzalni tez-tez to'liq suvda yuvish, ichki qismini esa faqat quruq cho'tka bilan tozalash lozim.", "Ichki qismiga maxsus parfyumeriya vositalarini purkash, bu yoqimsiz hidni yo'qotishga yordam beradi.", "Poyabzalni nam holatda saqlash, bu ichki qismdagi materiallarning yumshoqligini ta'minlaydi."], ["Sport sochiqlarini gigiyenik talablar bo'yicha qanday yuvish va saqlash kerak?", "Har bir mashg'ulotdan keyin issiq suvda (60°C dan yuqori) yuvish va to'liq quritish tavsiya etiladi.", "Sochiqlarni faqatgina sovuq suvda yuvish va ularni nam holatda uzoq vaqt saqlashga ruxsat berish kerak.", "Sochiqlarni haftada bir marta yuvish kifoya, ularni faqat quruq joyda, quyosh nuri tushmaydigan joyda saqlash kerak.", "Sochiqlarni dezinfeksiyalovchi vositalar bilan yuvish mutlaqo taqiqlanadi, bu ularning materialiga zarar yetkazadi."], ["Spirt asosidagi dezinfeksiyalovchi vositalarning asosiy afzalligi nimada?", "Ular bakteriyalar va viruslarga qarshi samarali, tez quriydi va anjomlarga zarar yetkazmaydi.", "Ular uzoq muddatli himoyani ta'minlaydi va suvga chidamli bo'lmagan materiallar uchun idealdir.", "Ular juda arzon va hamma joyda topilishi mumkin, shuning uchun iqtisodiy jihatdan foydalidir.", "Ular kuchli hidga ega emas, shuning uchun ventilyatsiya talab qilmaydi va foydalanishda juda qulaydir."], ["Sport inshootlarida umumiy foydalaniladigan anjomlarni tozalash chastotasi qanday bo'lishi kerak?", "Umumiy foydalaniladigan anjomlar har bir foydalanuvchidan keyin tozalanishi zarur.", "Umumiy anjomlar faqatgina kunning oxirida bir marta, barcha mashg'ulotlar tugaganidan so'ng tozalanishi kerak.", "Ularni faqat jiddiy ifloslangan hollarda yoki haftada bir marta chuqur tozalash amalga oshirilishi kifoya.", "Faqat metall qismlarni muntazam tozalash kerak, boshqa materiallar esa kamroq tozalanishi mumkin."], ["Sport anjomlarining ifloslanishi qanday asosiy sabablar tufayli yuzaga keladi?", "Ter, so'lak, nafas tomchilari va teri hujayralari kabi biologik suyuqliklar yig'ilishi sabab bo'ladi.", "Faqatgina chang va g'uborning anjomlarga doimiy yopishib qolishi bilan ifloslanish sodir bo'ladi.", "Asosan, sport zallarida havo haroratining me'yordan ortiq darajada bo'lishi ifloslanishga olib keladi.", "Mashg'ulotlar jarayonida anjomlarning doimiy mexanik shikastlanishi natijasida ifloslanish yuzaga keladi."], ["Sport anjomlarini noto'g'ri yoki yetarli darajada tozalashning qanday oqibatlari bo'lishi mumkin?", "Terida toshmalar, qichishish, zamburug'li kasalliklar va yiringli yallig'lanishlar yuzaga keladi.", "Anjomlarning mexanik shikastlanishi tezlashadi va ularning ranglari o'zgarib, estetik ko'rinishi buziladi.", "Sport zallarining havo harorati va namlik darajasi me'yordan oshib ketadi, bu mashg'ulotlarga xalaqit beradi.", "Sportchilarning o'zaro munosabatlari yomonlashadi va jamoaviy sport turlarida muvaffaqiyatga erishish qiyinlashadi."], ["Trenajyorlarni tozalashda ayniqsa qaysi qismlarga alohida e'tibor berish lozim?", "Qo'l tegadigan tutqichlar, pultlar, o'rindiqlar kabi intensiv foydalaniladigan yuzalar e'tibor talab qiladi.", "Asosan trenajyorlarning ostki qismlari va poydevorlari, chunki u yerda chang ko'proq to'planadi.", "Trenajyorlarning faqat metall qismlari, ularni zanglashdan himoya qilish uchun muntazam tozalash talab etiladi.", "Elektr panellari va simli ulanish joylari, ularni tozalash elektr toki xavfsizligini ta'minlaydi."], ["Yoga matlari va mashq gilamlarini saqlashda zamburug'lar ko'payishini oldini olish uchun nima qilish kerak?", "Matlarni hech qachon nam holatda yig'maslik kerak, chunki bu zamburug'lar ko'payishiga olib keladi.", "Matlarni quruq joyda, ammo yig'ilgan holatda saqlash tavsiya etiladi, bu ularning shaklini saqlaydi.", "Ularni nam holatda, ochiq havoda saqlash kerak, bu tabiiy shamollatishga imkon beradi.", "Matlarni har doim yig'ishdan oldin maxsus namlik yutuvchi kukunlar bilan ishlov berish kerak."], ["Sport zallari va kiyinish xonalarida optimal havo harorati va namlik darajalari qanday bo'lishi kerak?", "Sport zallarida 17-20°C, kiyinish xonalarida 20-22°C va havoning nisbiy namligi 40-60%.", "Sport zallarida 25-30°C, kiyinish xonalarida 15-18°C havo harorati va namlik 70-80% bo'lishi kerak.", "Havo harorati 10-15°C (sport zallari) va namlik 80-90% dan yuqori bo'lishi tavsiya etiladi.", "Barcha xonalarda doimiy 22-24°C harorat va 20-30% namlikni saqlash eng yaxshi holat hisoblanadi."], ["Kiyinish xonalari va dush xonalari gigiyenasini ta'minlashda qanday choralar ko'rilishi lozim?", "Ularni kuniga bir necha marta tozalash, dezinfeksiya qilish va silliq, suv o'tkazmaydigan materiallardan foydalanish.", "Bu joylar asosan havoning quruqligi tufayli ifloslanadi; kuniga bir marta oddiy chang artish yetarli.", "Kiyinish va dush xonalarini faqat mavsumiy chuqur tozalash kerak, chunki ifloslanish darajasi past.", "Ularda bakteriyalar ko'paymaydi, shuning uchun faqat estetik ko'rinish uchun muntazam ventilyatsiya zarur."], ["Xlor asosidagi dezinfeksiyalovchi vositalarning qanday muhim kamchiligi bor?", "Ular kuchli hidga ega va ba'zi materiallarga zarar yetkazishi mumkin, shuningdek ventilyatsiya talab etadi.", "Xlorli vositalar faqat ma'lum turdagi bakteriyalarga ta'sir qiladi, ammo zamburug'lar va viruslarga qarshi samarasiz.", "Ular juda sekin quriydi va anjomlar yuzasida namlik qoldiradi, bu esa zamburug'lar ko'payishiga olib keladi.", "Xlor asosidagi vositalar inson terisi uchun mutlaqo xavfsizdir va allergik reaksiyalarga sabab bo'lmaydi."], ["Sport anjomlari va gigiyena vositalarini tozalashning umumiy foydalari nimadan iborat?", "Kasalliklarning oldini olish, jarohatlanish xavfini kamaytirish va sportchilarning umumiy salomatligini mustahkamlash.", "Sport anjomlarining narxini pasaytirish, ularning yangi modelini tez-tez sotib olishga bo'lgan ehtiyojni bartaraf etish.", "Sportchilar orasida raqobat ruhini oshirish va jamoaviy sport turlarida g'alabaga intilish motivatsiyasini kuchaytirish.", "Mashg'ulotlar paytida yuzaga keladigan stress darajasini oshirish va organizmning chidamliligini sun'iy ravishda oshirish."], ["Oʻquvchi-yoshlar organizmining oʻsishi va yetilishi jarayonida jismoniy yuklamalarga javobi kattalarnikidan qanday farqlanadi?", "Bolalar va oʻsmirlarning jismoniy yuklamalarga javobi kattalarnikidan ancha farq qiladi, sababi organizm doimiy oʻsadi va takomillashadi.", "Bolalarning jismoniy yuklamaga javobi kattalarnikiga oʻxshash boʻlib, farq faqat intensivlik darajasida sezilarli boʻladi.", "Oʻsmirlar va kattalar organizmlari jismoniy yuklamalarga bir xil javob beradi, chunki oʻsish jarayoni yakunlangan hisoblanadi.", "Yosh bolalarning yuklamaga javobi kattalarnikidan doimiy ravishda yuqori samaradorlik koʻrsatadi, chunki ularda chidamlilik yuqoridir."], ["Jismoniy yuklamaga moslashuvning asosiy mazmuni qanday ifodalanadi?", "Avvalgi ishni kamroq fiziologik zoʻriqish bilan bajarish yoki maʼlum vaqt ichida yuqoriroq ish qobiliyatini namoyon eta olishdir.", "Organizmning har qanday yuklamaga bir xil va tez javob berish qobiliyati, tiklanish jarayonining sekinlashishi bilan izohlanadi.", "Faqatgina mushak massasining doimiy ravishda oshishi va yurak urish chastotasining maksimal darajada saqlanishi bilan belgilanadi.", "Har qanday jismoniy faollikdan soʻng uzoq muddatli charchoq holatining paydo boʻlishi va energiya zaxiralarining tez kamayishi."], ["Aerob imkoniyatlarni baholashda maktab sharoitida qaysi usullar xavfsiz va sodda hisoblanadi?", "Tinch holatdagi puls, yuklamadan oldin va keyin yurak urish chastotasi, yurish-yugurish testlari va bosqichli testlar qoʻllaniladi.", "Maksimal kislorod isteʼmoli (VO₂max) oʻlchash va murakkab spirometriya sinovlari kabi tibbiy asbob-uskunalar talab qiluvchi usullar.", "Faqatgina oʻquvchining subyektiv zoʻriqish darajasini baholash va uning umumiy kayfiyatini inobatga olish kabi yondashuvlar.", "Qon tahlillari orqali gormonlar darajasini aniqlash va mushak biopsiyasi natijalarini baholash kabi invaziv usullar ustun koʻriladi."], ["Nafas tizimini baholashda hayotiy sigʻimni oʻlchash uchun asosan qaysi usuldan foydalaniladi?", "Spirometriya orqali hayotiy sigʻim, majburiy hayotiy sigʻim va birinchi soniyadagi majburiy ekspirator hajm oʻlchanadi.", "Pulsoksimetr yordamida qondagi kislorod miqdorini doimiy kuzatib borish va nafas olish tezligini baholash muhim hisoblanadi.", "Tana haroratini oʻlchash va oʻquvchining umumiy ahvolini vizual kuzatish orqali nafas olish samaradorligi aniqlanadi.", "Faqatgina oʻquvchining jismoniy yuklama paytida nafas qisish darajasini subyektiv soʻrovnoma orqali baholash tavsiya etiladi."], ["Chiniqtirishning asosiy tamoyillari qanday boʻlishi kerakligi taʼkidlanadi?", "Chiniqtirish muntazamlik, bosqichma-bosqichlik, individual yondashuv va xavfsizlik tamoyillariga asoslanishi shart.", "Chiniqtirish faqatgina haddan tashqari sovuq taʼsirlar orqali tezkor natijalarga erishishga qaratilgan boʻlishi kerak, cheklovlar ahamiyatsizdir.", "Chiniqtirishda asosan umumiy yondashuv muhim, individual xususiyatlar va bosqichma-bosqichlik hisobga olinmasligi mumkin.", "Chiniqtirishni har qanday holatda boshlash va uning intensivligini tezkorlik bilan oshirish organizmga foyda keltiradi deb hisoblash."], ["Quyosh nuridan D vitamini sintezi uchun foydalanishda qaysi omillar hisobga olinishi zarur?", "Geografik kenglik, fasl, kun vaqti, teri pigmentatsiyasi, kiyim va terining ochiq qismining individual omillari hisobga olinadi.", "Faqatgina quyosh nurlarining intensivligi va tashqi harorat asosiy omil hisoblanadi, boshqa omillar ahamiyatsiz boʻladi.", "Vitamin D sintezi faqatgina yilning yoz oylarida samarali boʻladi, boshqa fasllarda esa ahamiyatsiz deb eʼtiborga olinadi.", "Organizmdagi D vitamini darajasi faqatgina ovqatlanish ratsioni va yoshga bogʻliq, quyosh nuri taʼsiri deyarli taʼsir qilmaydi."], ["O'quvchi-yoshlar organizmining jismoniy yuklamaga javobi kattalarnikidan farq qilishi nimada namoyon bo'ladi?", "Bolalar va o'smirlarning jismoniy yuklamaga javobi kattalarnikidan sezilarli darajada farq qiladi.", "Bolalar va o'smirlarning jismoniy yuklamaga javobi kattalarnikidan deyarli farq qilmaydi.", "Kattalarning jismoniy yuklamaga javobi bolalarnikidan har doim ham tezroq ko'tariladi.", "Bolalar va o'smirlarning jismoniy yuklamaga javobi har doim kattalarnikiga o'xshash kechadi."], ["Oʻquvchi-yoshlar organizmining oʻsishi qaysi tizimlarning tuzilishi va funksional takomillashuvini oʻz ichiga oladi?", "Suyak, mushak, yurak-qon tomir, nafas, asab va endokrin tizimlarning tuzilishi takomillashuvini.", "Faqatgina tana boʻyi va vaznining ortishi bilan cheklangan rivojlanish jarayonini o'z ichiga oladi.", "Asosan mushaklar hajmi va terining elastikligini oshirishni oʻzida qamrab oladi.", "Miyaning hajmini kengaytirish va ko'rish qobiliyatini yaxshilashni o'z ichiga oladi."], ["Boshlang'ich maktab yoshida harakat ko'nikmalarini rivojlantirish uchun qanday sharoitlar eng qulay hisoblanadi?", "Muvozanat, koordinatsiya, chaqqonlik va umumiy chidamlilikni bosqichma-bosqich rivojlantirish uchun.", "Faqatgina murakkab texnik elementlarni tez oʻzlashtirish va yuqori kuch yuklamalarini bajarish uchun.", "Asosan mushak massasini keskin oshirish va maksimal tezlikni rivojlantirishga qaratilgan sharoitlar.", "Bir tomonlama va juda og'ir yuklamalar orqali suyak to'qimasining mustahkamligini oshirish uchun."], ["Bolalarda mushak kuchining ortishi dastlab ko'proq nima bilan bog'liq bo'ladi, keyinroq esa boshqa omil ta'sir qiladi?", "Asab-mushak boshqaruvining yaxshilanishi bilan bog'liq boʻlib, keyinchalik massa ortadi.", "Faqat mushak tolalarining keskin o'lchamlari kattalashishi va suyaklarning birlashishi bilan bog'liq.", "Faqatgina suyak mineralizatsiyasining tezlashishi va boʻgʻimlarning elastikligining oshishi bilan.", "Ichki organlarning tez rivojlanishi va ularning umumiy tana vazniga nisbatan og'irligi bilan."], ["Maktab sharoitida aerob imkoniyatlarni baholashda qanday xavfsiz va sodda usullar ustun hisoblanadi?", "Tinch holatdagi puls, yuklamadan oldin va keyin yurak urish chastotasi, yurish-yugurish testlari.", "Maksimal kislorod iste'moli, invaziv kardiomonitoring va murakkab laboratoriya testlaridan foydalanish.", "Elektromiografiya, qon tahlillari va balandlikka sakrash bo'yicha murakkab motor testlar.", "Jigar fermentlari faolligini o'lchash, suyak zichligini aniqlash va qon bosimini doimiy kuzatish."], ["Nafas tizimini baholashda spirometriya orqali qanday asosiy ko'rsatkichlar o'lchanadi?", "Hayotiy sig'im, majburiy hayotiy sig'im va birinchi soniyadagi majburiy ekspirator hajm.", "Faqatgina nafas olish chastotasi va o'pka hajmining yuzaki ko'rsatkichlari, chuqurligi hamda ritmi.", "Qonning kislorodga to'yinganlik darajasi va qon plazmasidagi uglerod dioksid miqdori.", "Burun yo'llarining o'tkazuvchanligi va tomoqdagi shilliq pardaning holati."], ["Sovuq ta'sirida organizmda qanday fiziologik jarayonlar ketma-ket sodir bo'ladi?", "Teri qon tomirlari torayib, issiqlik yo'qotilishi cheklanadi; mushak titrashi va termogenez ishga tushadi.", "Teri qon tomirlari kengayadi, terlash kuchayadi va tana harorati sezilarli darajada ortadi.", "Ichki organlarning harorati keskin pasayadi va qon oqimi sezilarli darajada tezlashadi.", "Asab tizimining faoliyati keskin susayadi va mushaklardagi energiya zaxiralari kamayadi."], ["Chiniqtirishning asosiy tamoyillari qaysilar bo'lib, ular amaliyotda qat'iy qo'llanilishi kerak?", "Muntazamlik, bosqichma-bosqichlik, individual yondashuv va xavfsizlikdir.", "Maksimal yuklama, tezkor natija, guruhli yondashuv va qat'iy standartlar.", "Faqatgina yoshga bog'liq bo'lgan cheklovlar, tasodifiylik va yuqori intensivlik.", "Bir martalik keskin ta'sir, umumiy metodika, minimal kuzatuv va tezlik."], ["Quyosh nuri va D vitamini sintezi haqida matnda qanday ma'lumot berilgan?", "D vitamini sinteziga hissa qo'shadi, lekin 'har kuni ma'lum daqiqa' universal koʻrsatkichi mavjud emas.", "Quyosh nuri D vitaminini aniq bir foizga oshiradi va bu jarayon har doim bir xil tezlikda kechadi.", "D vitamini sinteziga faqatgina teri pigmentatsiyasi ta'sir qiladi, geografik kenglikka bog'liq emas.", "Quyoshdan foydalanish faqat foyda keltiradi va ultrabinafsha nurlanishning salbiy ta'siri mutlaqo yo'q."], ["Jismoniy mashqlar o'quvchi-yoshlarning funksional rivojlanishiga qanday kompleks ta'sir ko'rsatadi?", "Yurak-qon tomir va nafas tizimlarining ishini, asab-mushak imkoniyatlarini va suyak to'qimasini mustahkamlaydi.", "Faqatgina mushak massasini oshirishga va tana vaznini kamaytirishga xizmat qiladi, ruhiy holatga ta'sir qilmaydi.", "Asosan akademik oʻzlashtirishni yaxshilaydi va uyqu sifatiga sezilarli ta'sir ko'rsatmaydi.", "Miyadagi neyron aloqalarini zaiflashtiradi va motor ko'nikmalarini sekinlashtiradi."], ["Markaziy asab tizimi bolalik va o'smirlik davrida qanday asosiy xususiyatga ega?", "Asab tizimining plastiklik xususiyati yuqori boʻlib, takroriy va maqsadli mashqlar motor dasturlarni takomillashtiradi.", "Harakatlarni boshqarish, sezgi axborotini qayta ishlash va yangi ko'nikmalarni shakllantirishda hech qanday rol o'ynamaydi.", "Uning rivojlanishi faqat tug'ilishdan boshlab kattalik davrigacha bir xil tezlikda davom etadi va o'zgarishsiz qoladi.", "Diqqat, ijro funksiyalari va ruhiy farovonlik bilan jismoniy faollik o'rtasida hech qanday ijobiy bog'liqlik mavjud emas."], ["Maktab sharoitida o'quvchilarning aerob imkoniyatlarini baholashda qaysi usullar eng xavfsiz va sodda hisoblanadi?", "Tinch holatdagi puls, yuklamadan oldin va keyin yurak urish chastotasi, ma'lum masofaga yurish-yugurish testlari va bosqichli testlar.", "Faqat maksimal kislorod iste'molini o'lchashga qaratilgan murakkab laboratoriya testlari va tibbiy nazorat talab qiladigan usullar.", "Yurakning har bir urishida qon hajmini aniqlash va qon tomirlaridagi bosimni doimiy ravishda yuqori darajada ushlab turish usullari.", "O'quvchining jismoniy zo'riqish darajasini butunlay e'tiborsiz qoldirib, faqat mushaklarning massasini o'lchashga qaratilgan testlar."], ["Nafas tizimini baholashda pedagogik kuzatuv uchun qanday ko'rsatkichlar foydali hisoblanadi?", "Nafas chastotasi, yuklamadan keyingi nafasning tiklanishi va mashqni bajarishda nafas ritmining to'g'riligi muhimdir.", "Faqat spirometriya orqali o'lchanadigan majburiy hayotiy sig'im va birinchi soniyadagi majburiy ekspirator hajm asosiy mezon bo'lishi kerak.", "O'quvchining yoshiga qaramasdan doimiy ravishda maksimal nafas olish hajmini ta'minlash va nafas olish tezligini oshirish.", "O'pkaning anatomik tuzilishini faqat rentgenogramma orqali baholash va nafas olish mushaklarining faoliyatini butunlay e'tiborsiz qoldirish."], ["Chiniqtirishning asosiy tamoyillari qaysilar va ularga rioya qilish nima uchun muhim?", "Muntazamlik, bosqichma-bosqichlik, individual yondashuv va xavfsizlik; ular salbiy oqibatlarsiz samarali moslashuvni ta'minlaydi.", "Faqatgina bir martalik keskin sovuq ta'sir va \"qanchalik sovuq boʻlsa, shunchalik yaxshi\" tamoyili; bu eng tez natija beradi.", "Organizmni haddan tashqari issiqlikka o'rgatish va yozning eng issiq kunlarida uzoq vaqt quyoshda qolish asosiy mezon hisoblanadi.", "Faqat tibbiy mutaxassislarning aralashuvisiz, yoshga qaramasdan bir xil turdagi muolajalarni qo'llash va natijalarni zudlik bilan kutish."], ["Chiniqtirishning virusli infeksiyalardan himoya qilish yoki immunitetni ma'lum foizga oshirish borasidagi ilmiy asoslangan fikr qanday?", "Chiniqtirish termik noqulaylikka chidamlilikni yaxshilasa-da, uni virusli infeksiyalardan to'liq himoya deb ko'rsatish ilmiy jihatdan noto'g'ri.", "U virusli infeksiyalardan mutlaqo himoya qiladi va immunitetni har doim 100% ga oshirishga kafolat beradi.", "Faqatgina chiniqtirish orqali sog'lom turmush tarzi talablariga rioya qilish shart emas, chunki u organizmga umuman ta'sir ko'rsatmaydi.", "Chiniqtirish faqat kasallik tarqalishiga qarshi umumiy choralar qatoriga kirmaydi, balki ularni butunlay bekor qilishga qodir yagona vositadir."], ["Jismoniy mashg'ulotlar paytida yoki undan keyin qanday belgilar paydo bo'lganda mashqni to'xtatish va tibbiy baholash zarur?", "Kuchli charchoq, bosh aylanishi, koʻkrakdagi og'riq, hushdan ketish, keskin nafas qisishi yoki og'riq paydo boʻlsa.", "Yurak urish chastotasi yuklamaga mos ravishda ortib, dam olishda asta pasayganda, chunki bu doimiy muammoni ko'rsatadi.", "Nafas olish tezligi yuklamaga mos tezlashganda va dam olishda tiklanganda, bu mushaklarning faoliyatidagi jiddiy buzilishlarni ko'rsatadi.", "Harakat texnikasi va koordinatsiya saqlanganda, faollik va nazorat me'yoriy javobda bo'lganda, chunki bu doimiy patologiyani anglatadi."], ["Jismoniy tarbiya mashg'ulotlarini rejalashtirishda yoshdan tashqari yana qaysi omillar hisobga olinishi muhimdir?", "Sog'liq holati, jismoniy tayyorgarlik, individual rivojlanish va avvalgi harakat tajribasi ham albatta hisobga olinishi kerak.", "Faqatgina o'quvchining pasport yoshi va oilasining ijtimoiy-iqtisodiy holati, boshqa omillar e'tiborga olinmaydi.", "Asosan o'quvchining jinsi va maktabdagi baholari, chunki bu omillar uning imkoniyatlarini to'liq belgilab beradi.", "Faqat o'qituvchining tajribasi va maktab dasturi, chunki barcha o'quvchilar bir xil rivojlanish darajasida bo'ladi deb hisoblanadi."], ["Jismoniy mashqlar nafas olish tizimining faoliyatiga qanday asosiy ta'sir ko'rsatadi?", "Nafas mushaklari faoliyati, ventilyatsiya samaradorligi va yuklama paytida kislorod tashish tizimining muvofiqlashuvini yaxshilaydi.", "O'pkaning anatomik hajmini keskin “kattalashtiradi”, lekin nafas olish mushaklari funksiyasiga sezilarli ta'sir ko'rsatmaydi.", "Nafas olish tizimining yoshga bog'liq o'zgarishlarini to'xtatadi, hayotiy o'pka sig'imini o'zgarmas holatda saqlaydi.", "Nafas olish tizimining umumiy faolligini pasaytiradi, kislorod tashish tizimining samaradorligini yomonlashtiradi va ventilyatsiyani cheklaydi."], ["Endokrin tizimning o'sish va jismoniy rivojlanishdagi roli hamda pubertat davrida yuz beradigan gormonal o'zgarishlar qanday?", "O'sish gormoni, qalqonsimon bez gormonlari, insulin va jinsiy gormonlar suyak, mushak, energiya almashinuviga ta'sir qiladi; pubertat davrida jinsiy farqlar kuchayadi.", "Endokrin tizim faqat tana hajmini boshqaradi, gormonal o'zgarishlar jismoniy rivojlanishga bevosita ta'sir ko'rsatmaydi va jinsiy farqlarga olib kelmaydi.", "Pubertat davrida faqat estrogen darajasi o'zgaradi, bu suyak va mushak rivojlanishiga ta'sir qilmaydi, aksincha ularni cheklaydi.", "Gormonal o'zgarishlar faqat tana vaznining ortishiga olib keladi, suyak mineral zichligi va mushak massasi o'zgarishsiz qoladi."], ["Maktab sharoitida o'quvchilarning aerob imkoniyatlarini baholashda qanday sodda va xavfsiz usullar ustun hisoblanadi?", "Tinch holatdagi puls, yuklamadan oldin va keyin yurak urish chastotasi, ma'lum masofaga yurish-yugurish testlari, bosqichli testlar.", "Faqat maksimal kislorod iste'molini o'lchash va murakkab tibbiy jihozlardan foydalanish, chunki bu eng aniq va zarur usuldir.", "O'quvchining qisqa muddatli sprint tezligini o'lchash va kuch mashqlaridagi maksimal takrorlar sonini hisoblash, aerob imkoniyatlar uchun aniq emas.", "Faqat o'quvchining subyektiv his-tuyg'ulari va uning o'qituvchisining kuzatuvlari, har qanday obyektiv testlarsiz baholash."], ["Jismoniy tarbiya mashg'ulotlarini rejalashtirishda yoshdan tashqari yana qanday omillar hisobga olinishi kerak?", "Sog'liq holati, jismoniy tayyorgarlik darajasi, individual rivojlanish va avvalgi harakat tajribasi.", "Faqatgina o'quvchining jinsiy balog'at bosqichi va psixologik holatining barqarorligi.", "Asosiy e'tibor dars o'qituvchisining malakasi hamda mashg'ulot joyining zarur jihozlanishi.", "Ajratilgan umumiy vaqt, o'quvchilarning akademik yutuqlari va maktabdagi fanlarga bo'lgan qiziqishi."], ["Chiniqtirishning asosiy tamoyillari qaysilar?", "Muntazamlik, bosqichma-bosqichlik, individual yondashuv va xavfsizlik tamoyillariga rioya qilish.", "Bir martalik kuchli ta'sir, maksimal yuklama va jismoniy zo'riqish bilan tezda moslashish usuli.", "Faqatgina suv muolajalaridan foydalanish, dori vositalari bilan birga qo'llash va yuqori natijaga erishish.", "Haroratni keskin o'zgartirish, guruxiy yondashuv va qisqa muddatli, ammo juda intensiv muolajalar."], ["Bolalarda jismoniy yuklamaga javoban yurak urish chastotasi kattalarnikiga nisbatan qanday o'zgaradi?", "Bir xil absolyut ishga javoban yurak urish chastotasi kattalarnikiga nisbatan tezroq ko'tarilishi.", "Tezroq pasayadi va tinch holatga qaytishi tezlashadi, yuklamadan keyin minimal o'zgaradi.", "Asosan o'zgarmaydi, yoshga bog'liq farqlar kuzatilmaydi, organizm javobi bir xil bo'ladi.", "Sekinroq ko'tariladi va uzoqroq vaqt davomida yuqori bo'lib qoladi, bu normal holat hisoblanadi."], ["Jismoniy yuklamani oshirishda qanday asosiy qoida amalga oshirilishi lozim?", "Texnika o'rgatilgach, takrorlar soni, davomiylik va murakkablik bosqichma-bosqich oshirilishi lozim.", "Mashg'ulot boshida barcha parametrlarni maksimal darajaga olib chiqib, imkon qadar yuqori natijaga erishish.", "Faqatgina takrorlar sonini oshirishga e'tibor beriladi, texnika va davomiylik ahamiyatsiz deb hisoblanadi.", "Mashg'ulotdan keyin kuchli charchoq paydo bo'lguncha yuklamani uzluksiz va keskin oshirish."], ["Mashg'ulot paytida o'quvchida qanday belgilar yuzaga kelsa, mashqni to'xtatish va tibbiy baholash talab etiladi?", "Kuchli charchoq, bosh aylanishi, ko'krakdagi og'riq, hushdan ketish yoki keskin nafas qisishi.", "Yuklama bilan yurak urish chastotasining muntazam ortishi va nafas olishning tabiiy tezlashishi.", "Harakat texnikasining biroz yomonlashishi va mashg'ulotdan keyin bir oz muddat charchoqni his qilish.", "Mashg'ulot paytida biroz terlash va tana haroratining biroz ko'tarilishi bilan birga bo'lishi."], ["Markaziy asab tizimi o'quvchi-yoshlarning jismoniy rivojlanishida qanday yetakchi ahamiyatga ega?", "Harakatlarni boshqarish, sezgi axborotini qayta ishlash, koordinatsiya, muvozanat va yangi motor ko'nikmalarni shakllantirishda.", "Faqatgina mushaklarning energiya ishlab chiqarish jarayonini nazorat qilish va ularning tez tiklanishini ta'minlashga yo'naltirilgan.", "Asosan tana haroratini barqaror saqlash va endokrin bezlarning funksional faoliyatini to'liq boshqarishdan iborat.", "Suyak mineralizatsiyasini tezlashtirish va suyak to'qimasining mustahkamligini sezilarli darajada oshirish vazifasi yuklatilgan."], ["Jahon sog'liqni saqlash tashkilotining 5-17 yoshdagi bolalar va o'smirlar uchun jismoniy faollik bo'yicha tavsiyalari qanday?", "Har kuni kamida 60 daqiqa o'rta va yuqori intensivlikdagi, asosan aerob faollik; haftasiga 3 kun yuqori intensivlikda.", "Haftasiga faqat 3 marta 30 daqiqalik intensiv mashg'ulotlar, mushaklarni mustahkamlovchi faoliyatlarsiz.", "Kuniga 15 daqiqadan oshmagan, ammo juda yuqori intensivlikdagi sport o'yinlari bilan cheklanish lozim.", "Faqat maktabdagi jismoniy tarbiya darslari bilan cheklanish va qo'shimcha faollikni umuman talab etmaslik."], ["Mashg'ulotning tayyorlov qismi organizmni asosiy yuklamaga qanday tayyorlaydi?", "Yurak urishini va tana haroratini asta-sekin ko'taradi, bo'g'imlar va mushaklarni faoliyatga tayyorlaydi.", "To'g'ridan-to'g'ri asosiy kuch yuklamasini berish orqali mushak tolalarini maksimal darajada faollashtiradi.", "Mashg'ulotning eng muhim qismini imkon qadar tezroq bajarishga yordam beradi va jarayonni tezlashtiradi.", "Faqatgina psixologik tayyorgarlikni ta'minlaydi, jismoniy o'zgarishlarsiz amalga oshiriladigan vazifadir."], ["Noto'g'ri tashkil etilgan chiniqtirish muolajalari qanday salbiy oqibatlarga olib kelishi mumkin?", "Sovuq shikastlanishi, noqulaylik va boshqa salbiy holatlar, agar organizm tayyor bo'lmasa.", "Asosan immunitetning sezilarli darajada pasayishi va tez-tez kasal bo'lish holatlariga olib kelish.", "Har doim tana haroratining keskin ko'tarilishi va issiqlik urishi xavfi sezilarli darajada oshishi.", "Faqatgina teri qoplamining rang o'zgarishi va mayda toshmalarning paydo bo'lishi bilan cheklanish."], ["Quyosh nuri organizmda D vitamini sinteziga hissa qo'shishiga qaramay, uning samaradorligi qanday omillarga bog'liq?", "Geografik kenglik, fasl, kun vaqti, teri pigmentatsiyasi, kiyim, terining ochiq qismi va individual omillar.", "Faqatgina yoshga bog'liq bo'lib, barcha yoshdagilar uchun bir xil darajada samarali ta'sir ko'rsatishi bilan cheklanadi.", "Asosan to'g'ri ovqatlanish va boshqa vitaminlarni qo'shimcha ravishda qabul qilish bilan bevosita bog'liq holda.", "Har qanday sharoitda va istalgan vaqtda quyoshda bo'lish D vitamini darajasini har doim bir xilda oshirishi ilmiy jihatdan noto'g'ri."], ["Boshlang'ich maktab yoshidagi o'quvchilar uchun jismoniy mashg'ulotlarni rejalashtirishda asosan qaysi ko'nikmalar rivojlanishiga e'tibor qaratiladi?", "Harakat ko'nikmalarini o'zlashtirish, muvozanat, koordinatsiya va umumiy chidamlilikni bosqichma-bosqich rivojlantirish.", "Maksimal kuch va tezkorlikni rivojlantirishga qaratilgan yuqori intensivlikdagi og'ir yuklamalarni tezda kiritish asosiy maqsad.", "Faqat bir tomonlama, ixtisoslashgan sport turlariga e'tibor berib, texnikani mukammal darajada o'rgatishga ustuvorlik berish.", "Suyak to'qimasi o'sish plastinkalari yopilmagani sababli, har qanday mashqdan butunlay cheklanishni tavsiya etish lozim."], ["O'quvchi-yoshlarda yosh ulg'ayishi bilan yurak-qon tomir tizimida sodir bo'ladigan o'zgarishlarga qaysi biri kiradi?", "Yurak hajmi va zarb hajmi ortadi, tinch holatdagi yurak urish chastotasi esa asta-sekin kamayishga moyil bo'ladi.", "Yurak hajmi kamayadi va zarb hajmi ham pasayadi, yurak urish chastotasi esa yoshga qarab sezilarli darajada oshib boradi.", "Yurak hajmi o'zgarishsiz qoladi, ammo zarb hajmi keskin ortadi, tinch holatdagi puls barqaror darajada saqlanadi.", "Yurak mushagi massasi doimiy ravishda pasayib boradi, bu esa zarb hajmining kamayishiga va pulsning oshishiga olib keladi."], ["Chiniqtirishning fiziologik asosini nima tashkil etadi?", "Termoregulyatsiya tizimining takomillashuvi, tana haroratini barqaror saqlashda teri qon tomirlari ishtiroki.", "Faqat yurak-qon tomir tizimining ish faoliyatini oshirish va nafas olish tezligini doimiy ravishda pasaytirishdir.", "Mushak massasini keskin oshirish va suyak to'qimalarining zichligini pasaytirish, bu asosiy fiziologik asosdir.", "Endokrin bezlar faoliyatini to'xtatish va asab tizimining barcha funksiyalarini susaytirish orqali erishiladi u."], ["Chiniqtirishning asosiy tamoyillariga nimalar kiradi?", "Muntazamlik, bosqichma-bosqichlik, individual yondashuv va xavfsizlikka rioya qilish.", "Bir martalik keskin sovuq ta'sirga duchor bo'lish, har qanday sharoitda tez va intensiv chiniqtirishni talab qilish.", "O'quvchining yoshiga va sog'lig'iga qaramay, har doim haddan tashqari sovuq suv va uzoq muddatli muolajalarni qo'llash.", "Chiniqtirish jarayonida nazoratni butunlay bekor qilish, organizmning javobini hisobga olmasdan harakat qilish."], ["Chiniqtirishning sog'lomlashtiruvchi ta'siriga qaysi da'vo ilmiy jihatdan noto'g'ri hisoblanadi?", "Virusli infeksiyalardan to'liq himoya qiladi yoki “immunitetni aniq foizga oshiradi” degan universal usul sifatida ko'rsatish.", "Termik noqulaylikka chidamlilikni yaxshilaydi va organizmning tabiiy muhitga moslashuvini qo'llab-quvvatlaydi.", "Infeksiyalarning oldini olishda uyqu, ovqatlanish, gigiyena, emlash va jismoniy faollik bilan birga muhim o'rin tutadi.", "Subyektiv moslashuvni yaxshilaydi va organizmning turli omillarga chidamliligini oshirishga yordam beradi."], ["Jahon sog'liqni saqlash tashkilotining 5-17 yoshdagi bolalar va o'smirlar uchun tavsiyasi nimadan iborat?", "Haftasiga kuniga kamida 60 daqiqa oʻrta va yuqori intensivlikdagi aerob faollik, haftasiga 3 kun kuch mashqlari.", "Kuniga 30 daqiqadan kam bo'lgan past intensivlikdagi faollik, mushak va suyaklarni mustahkamlovchi mashqlarni cheklash.", "Haftada faqat bir kun yuqori intensivlikdagi mashg'ulotlar, boshqa kunlari esa butunlay passiv dam olish talab etiladi.", "Faqatgina kuch mashqlari va og'irlik ko'tarishga e'tibor berish, aerob faollikni butunlay cheklash tavsiya qilinadi."], ["Amaliy nazoratda nafas olish bilan bog'liq ehtiyot bo'lish belgisiga nima kiradi?", "Keskin nafas qisishi, gapira olmaslik, xirillash kabi noodatiy holatlar.", "Yuklamaga mos ravishda nafasning tezlashishi va damda tiklanishi.", "Nafas ritmining doimiy va bir xil tempda saqlanishi holati.", "Mashg'ulotdan keyin nafasning to'liq normal holatga qaytishi darajasi."], ["Amaliy nazoratda harakat sifati bilan bog'liq ehtiyot bo'lish belgisiga nima kiradi?", "Koordinatsiyaning buzilishi, kuchli titrash, og'riqning paydo bo'lishi.", "Texnika va koordinatsiyaning mashg'ulot davomida saqlanishi.", "Harakatlarni bajarishda to'liq energiya va kuchning namoyon bo'lishi.", "Harakatlar davomiyligining doimiy ravishda oshib borishi holati."], ["Chiniqtirishni jismoniy mashqlar bilan uyg'unlashtirishda asosiy maqsad nima?", "Organizmning tabiiy muhitga xavfsiz moslashuvini qo'llab-quvvatlash, ekstremal ta'sirlardan qochish.", "Qanchalik sovuq bo'lsa, shunchalik yaxshi\" tamoyili asosida maksimal sovuq ta'sirga doimiy intilish.", "Suzish va suv muolajalari kabi faqat bitta turdagi chiniqtirish usullaridan muntazam foydalanish.", "Organizmning termoregulyatsiya tizimini butunlay faolsizlantirish va tashqi ta'sirlarga immunitetni kuchaytirish."], ["Sovuq ta'sirida organizmda issiqlik yo'qotilishini kamaytirishga xizmat qiluvchi mexanizm qaysi?", "Periferik vazokonstriksiya, ya'ni teri qon tomirlarining torayishi orqali.", "Terlashning kuchayishi va terning bug'lanishi orqali tanani sovutish.", "Mushaklarning doimiy qisqarishi natijasida faqat issiqlik hosil qilish.", "Nafas olish tezligining oshishi va chuqurlashishi bilan bog'liq jarayonlar."], ["Issiq sharoitda ko'p terlash natijasida organizm qanday moddalarni yo'qotadi?", "Suv bilan birga elektrolitlar, ayniqsa natriy ionlarini yo'qotadi.", "Faqat yog'larni yo'qotadi, bu energiya zahiralarini tezda kamaytiradi.", "Qon hujayralari sonini kamaytiradi va immunitet tizimini pasaytiradi.", "Oqsillarni yo'qotadi, mushak massasini kamaytiradi va tiklanishni sekinlashtiradi."], ["Organizmni gomeostazni saqlashga yo'naltirilgan javobi qanday namoyon bo'ladi?", "Ichki muhitning nisbatan barqarorligini saqlashga bo'lgan doimiy intilish bilan.", "Faqat tashqi muhitga moslashish qobiliyatini rivojlantirish bilan cheklanadi.", "Tana haroratini doimiy ravishda o'zgartirish bilan bog'liq bo'ladi.", "Metabolizm tezligini butunlay to'xtatish bilan bog'liq bo'ladi."], ["Sportchining tashqi muhit sharoitidagi ish qobiliyatini saqlashda nimaning ahamiyati katta?", "Suv-elektrolit muvozanatini to'g'ri boshqarish va yetarli darajada ta'minlash.", "Faqat yuqori kaloriyali oziq-ovqat iste'mol qilishni doimiy ravishda oshirish.", "Jismoniy yuklamalarni mutlaqo kamaytirish va mashg'ulotlarni to'xtatish.", "Psixologik mashg'ulotlarni butunlay rad etish va e'tiborsiz qoldirish."], ["Sportchining yuqori ish qobiliyatini saqlash uchun tashqi muhit sharoitida mashg'ulot yuklamasini qanday rejalashtirish zarur?", "Individual rejalashtirish, yetarli tiklanish va xavfsizlik choralarini ta'minlash.", "Hamma sportchilar uchun bir xil, standart yuklamalarni qo'llash majburiy.", "Eng og'ir yuklamalarni iloji boricha tezroq bajarishga intilish asosiy usuldir.", "Dam olish va tiklanishni butunlay e'tiborsiz qoldirish maqsadga muvofiqdir."], ["Issiq sharoitda inson organizmining asosiy himoya mexanizmi nima hisoblanadi va u qanday sodir boʻladi?", "Terlash va terining teri yuzasidan bug'lanishi issiqlikni tashqi muhitga samarali chiqarishga yordam beruvchi himoya mexanizmidir.", "Organizmning ichki tana haroratini oshirish orqali metabolik jarayonlarni sekinlashtirish issiqlikni saqlashga xizmat qiladi.", "Teri qon tomirlarining torayishi va qon oqimining kamayishi issiqlik yoʻqotilishini minimallashtirishga asosiy vositadir.", "Mushaklarning ixtiyorsiz qisqarishi (titrash) tana haroratini pasaytirish uchun avtomatik tarzda faollashuvchi jarayondir."], ["Sportchining ish qobiliyatining fiziologik asosida qaysi jarayonlar va tizimlar yotadi?", "Mushaklarning energiya bilan ta'minlanishi, kislorod yetkazilishi, moddalar almashinuvi, termoregulyatsiya va markaziy asab tizimining boshqaruv faoliyati.", "Faqat sportchining ruhiy barqarorligi va uzoq muddatli mashg'ulotlarining muntazamligi uning ish qobiliyatini belgilaydi.", "Genetik moyillik, ovqatlanish rejasi va tashqi yordamchi vositalardan samarali foydalanish ish qobiliyatining asosi hisoblanadi.", "Faoliyatning yuqori darajada muvofiqlashishi, jismoniy kuchning doimiy o'sishi va raqobatbardoshlik omillari."], ["Baland tog' sharoitida atmosfera bosimi va kislorodning parsial bosimi qanday o'zgaradi va buning organizmga ta'siri qanday?", "Atmosfera bosimi pasayadi, kislorodning parsial bosimi kamayadi, bu esa gipoksik ta'sirni yuzaga keltiradi.", "Atmosfera bosimi oshadi, kislorodning parsial bosimi ham oshadi, bu organizmning energiya sarfini kamaytiradi.", "Balandlikda atmosfera bosimi o'zgarmaydi, ammo havodagi kislorod miqdori sezilarli darajada kamayadi.", "Kislorodning parsial bosimi oshadi, lekin havo harorati sezilarli darajada pasayib, organizmga salbiy ta'sir ko'rsatadi."], ["Issiq sharoitda qon aylanish tizimiga tushadigan qo'shimcha yuk nimadan iborat?", "Ishlayotgan mushaklarni kislorod bilan ta'minlash va teriga qon yetkazib, issiqlikni chiqarish vazifalarini bir vaqtda bajarish.", "Tana haroratini pasaytirish uchun yurak urish tezligining keskin kamayishi va qon bosimining nazorati.", "Faqat terlash orqali suv-elektrolit muvozanatini saqlashga qaratilgan harakatlar va buyraklar faoliyatining kuchayishi.", "Kislorod tashish qobiliyatini oshirish maqsadida qizil qon hujayralari ishlab chiqarilishini tezlashtirish va ularni mushaklarga yo'naltirish."], ["Balandlikka moslashuv jarayonida dastlabki davrda qaysi fiziologik o'zgarish muhim rol o'ynaydi?", "Dastlab ventilyatsiyaning kuchayishi o'pkaga koʻproq havo kirishini ta'minlab, kislorod yetishmovchiligini qisman qoplashga yordam beradi.", "Qizil qon hujayralari sonining keskin ortishi va gemoglobin miqdorining birdaniga ko'payishi asosiy omil hisoblanadi.", "Yurak urish chastotasining sezilarli darajada pasayishi va qon bosimining tushishi balandlikka moslashuvning asosidir.", "Mushaklar faoliyatining keskin kamayishi va energiya sarfining minimum darajaga tushirilishi moslashuvni tezlashtiradi."], ["Issiq va nam sharoitda organizmning qizib ketish xavfi nima sababdan quruq issiq sharoitga nisbatan yuqori bo'lishi mumkin?", "Yuqori namlikda ter koʻp ajralishi mumkin boʻlsa-da, uning bug'lanishi qiyinlashadi, bu sovitish samaradorligini pasaytiradi.", "Namlikning oshishi teri qon tomirlarining torayishiga olib keladi, bu esa issiqlikning tashqi muhitga chiqarilishini to'xtatadi.", "Quruq issiq sharoitda organizm kamroq terlaydi, shu sababli tana harorati me'yorda saqlanadi va xavf tug'dirmaydi.", "Issiq va nam sharoitda organizmning metabolizmi tezlashadi, bu esa tana haroratini avtomatik ravishda pasaytirishga xizmat qiladi."], ["Uzoq davom etadigan va koʻp terlash kuzatiladigan yuklamalarda faqat suv emas, balki nimalarning tiklanishi ham ahamiyat kasb etadi?", "Elektrolitlarning tiklanishi ham katta ahamiyatga ega, chunki ular ter bilan birga yo'qotiladi.", "Faqat organizmga qo'shimcha uglevodlar va yog'larning tiklanishi muhim, suv ichish shart emas.", "Suyultirilgan oqsillar va vitamin komplekslarining tiklanishi energiya muvozanatini saqlash uchun asosiy shartdir.", "Qo'shimcha mineral tuzlarni qabul qilish faqat qisqa muddatli mashg'ulotlarda zarur bo'ladi, uzoq muddatlilarda emas."], ["Sport kiyimi tashqi muhitga mos tanlanishi qanday ahamiyatga ega va u qanday funksiyalarni bajarishi kerak?", "Issiqda issiqlik almashinuvi va terning bug'lanishiga imkon berishi, sovuqda esa issiqlikni saqlashi va namlikni boshqarishi zarur.", "Sport kiyimi har doim tana haroratini oshirishi, bu esa metabolik jarayonlarni tezlashtirishga yordam berishi kerak.", "Kiyimning asosiy vazifasi faqatgina sportchining estetik ko'rinishini yaxshilash va uning harakatlariga xalaqit bermaslikdir.", "Sport kiyimi faqat tashqi sharoitlardan himoya qilishi kerak, ichki termoregulyatsiyaga umuman ta'sir ko'rsatmasligi lozim."], ["Sovuq sharoitda organizmning asosiy vazifasi nima va unga erishish uchun qanday mexanizmlar ishga tushadi?", "Asosiy vazifa issiqlik yo'qotilishini kamaytirish va issiqlik ishlab chiqarishni ko'paytirishdir (vazokonstriksiya, titrash).", "Asosiy vazifa tana haroratini keskin oshirish va buning uchun terlash mexanizmlarini maksimal darajada faollashtirish.", "Asosiy vazifa mushaklarning maksimal kuchlanishini saqlab qolish va energiya almashinuvini minimal darajaga tushirish.", "Asosiy vazifa qonning kislorod tashish qobiliyatini oshirish va nafas olish tezligini sezilarli darajada pasaytirish."], ["Mushaklarning ixtiyorsiz qisqarishi – titrash termogenezi qanday vazifani bajaradi?", "Metabolik issiqlik hosil boʻlishini oshirib, tananing sovishiga qarshi kurashishga yordam beradi.", "Maksimal kuchlanishda mushaklarning chidamliligini oshiradi va toliqish jarayonini sekinlashtiradi.", "Qon bosimini nazorat qiladi va yurak urish chastotasini barqaror darajada ushlab turishga yordam beradi.", "Organizmdagi ortiqcha suyuqlikni chiqarib tashlash va elektrolitlar muvozanatini tiklashga xizmat qiladi."], ["Balandlik oshgan sari kislorodning parsial bosimi nima sababdan kamayadi?", "Umumiy atmosfera bosimi pasaygani sababli havodagi kislorodning ulushi oʻzgarmasa ham uning bosimi kamayadi.", "Balandlikda kislorod molekulalarining hajmi kichrayadi, bu esa ularning havo tarkibidagi ulushini kamaytiradi.", "Balandlikda kislorodning o'zi atmosferada mavjud bo'lmaydi, shuning uchun uning bosimi nolga teng bo'ladi.", "Balandlikda havo tarkibidagi karbonat angidrid miqdori oshadi, bu kislorod bosimini sun'iy ravishda pasaytiradi."], ["Balandlik sharoitida aerob ish qobiliyatining muhim koʻrsatkichi bo'lgan maksimal kislorod iste'moli (VO2max) qanday o'zgaradi?", "VO2max pasayadi, chunki ishlayotgan mushaklarga kislorod yetkazib berish imkoniyati cheklanadi.", "VO2max sezilarli darajada oshadi, bu esa organizmning kisloroddan foydalanish samaradorligini kuchaytiradi.", "VO2max o'zgarmaydi, chunki tana kislorod tanqisligiga tez moslashish qobiliyatiga ega bo'ladi.", "VO2max dastlab pasayadi, keyin esa bir necha kun ichida dengiz sathidagi darajadan yuqoriga ko'tariladi."], ["Issiq muhitda mashq qilganda sportchining ish qobiliyatini saqlashda nimaning ahamiyati katta?", "Suv-elektrolit muvozanatini saqlash katta ahamiyatga ega, chunki suyuqlik yo'qotilishi sezilarli farqlanadi.", "Ovqat hazm qilish jarayonini tezlashtirish va yuqori kaloriyali ovqatlarni iste'mol qilish muhim ahamiyatga ega.", "Mushak massasini doimiy ravishda oshirib borish va qisqa muddatli, yuqori intensivlikdagi mashg'ulotlarni o'tkazish.", "Qon bosimini sun'iy ravishda pasaytirish va yurak urish chastotasini kamaytirish orqali energiyani tejash."], ["Sportchining tashqi muhit sharoitiga moslashishda mashg'ulot intensivligini qanday o'zgartirish kerak?", "Mashg'ulot intensivligini bosqichma-bosqich oshirish muhimdir, dastlab maksimal yuklamadan qochish kerak.", "Darhol maksimal yuklamalar bilan mashg'ulotlarni boshlash kerak, bu organizmni tezroq moslashtiradi.", "Intensivlikni doimiy ravishda past darajada ushlab turish va yuqori aerob yuklamalardan butunlay voz kechish kerak.", "Mashg'ulot hajmini keskin kamaytirish, ammo intensivligini o'zgartirmasdan, faqat texnikani takomillashtirish."], ["Sovuq sharoitda qo'l va oyoq mushaklari hamda bo'g'imlarining funksional imkoniyatlari qanday o'zgarishi mumkin?", "Funksional imkoniyatlari pasayishi, harakat aniqligi va tezligi yomonlashishi, noqulaylik sezilishi mumkin.", "Funksional imkoniyatlari sezilarli darajada oshadi, harakat aniqligi va tezligi juda yaxshilanadi.", "Bo'g'imlarning harakatchanligi kamaymaydi, ammo mushaklarda kuchlanishning ortishi va elastiklik yo'qolishi kuza
