<!DOCTYPE html>

<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#f6f7f9;--card:#fff;--text:#1b1f24;--muted:#5f6b7a;--line:#d9dee5;--accent:#2563eb;
--ok-bg:#dcfce7;--ok-line:#16a34a;--ok-text:#14532d;--bad-bg:#fee2e2;--bad-line:#dc2626;--bad-text:#7f1d1d;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121418;--card:#1c2027;--text:#e8ebef;--muted:#9aa5b4;--line:#323945;--accent:#60a5fa;
--ok-bg:#12351f;--ok-line:#22c55e;--ok-text:#bbf7d0;--bad-bg:#3b1618;--bad-line:#f87171;--bad-text:#fecaca;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#121418;--card:#1c2027;--text:#e8ebef;--muted:#9aa5b4;--line:#323945;--accent:#60a5fa;
--ok-bg:#12351f;--ok-line:#22c55e;--ok-text:#bbf7d0;--bad-bg:#3b1618;--bad-line:#f87171;--bad-text:#fecaca;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:720px;margin:0 auto;padding:20px 16px 40px}
h1{font-size:1.4rem;margin:0 0 6px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px}
.muted{color:var(--muted)}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin:8px 0 18px}
.bar i{display:block;height:100%;background:var(--accent);width:0;transition:width .25s}
.top{display:flex;justify-content:space-between;font-size:.9rem;color:var(--muted)}
.q{font-size:1.1rem;font-weight:600;margin:0 0 16px}
.opt{display:block;width:100%;text-align:left;font:inherit;color:inherit;background:var(--card);border:2px solid var(--line);border-radius:10px;padding:12px 14px;margin:0 0 10px;cursor:pointer}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt:disabled{cursor:default}
.opt.ok{background:var(--ok-bg);border-color:var(--ok-line);color:var(--ok-text)}
.opt.bad{background:var(--bad-bg);border-color:var(--bad-line);color:var(--bad-text)}
.btn{font:inherit;font-weight:600;background:var(--accent);color:#fff;border:0;border-radius:10px;padding:12px 22px;cursor:pointer}
.btn.sec{background:transparent;color:var(--accent);border:2px solid var(--accent)}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:8px}
.score{font-size:2.4rem;font-weight:700;margin:6px 0}
.rev{border-top:1px solid var(--line);padding:12px 0}
.rev b{display:block;margin-bottom:4px}
.rev .a{border-radius:6px;padding:4px 8px;margin:3px 0;font-size:.95rem}
.hidden{display:none}
.sub{display:flex;justify-content:space-between;gap:10px}
.sub.sel{border-color:var(--accent);background:var(--ok-bg);background:color-mix(in srgb,var(--accent) 14%,var(--card))}
.sub small{color:var(--muted)}
input[type=number]{font:inherit;width:90px;padding:8px;border-radius:8px;border:2px solid var(--line);background:var(--card);color:var(--text)}
</style></head><body><div class="wrap">

<script>
const SUBJ=[{"name": "Uzluksiz ta’limdagi tendensiyalar va zamonaviy yondashuvlar", "q": [["Matnda keltirilgan \"Modernizatsiya\" tushunchasining asosiy mazmuni nimadan iborat?", "An'anaviy jamiyatdan zamonaviy jamiyatga o'tishda ijtimoiy-siyosiy tizimni sifat jihatidan o'zgartirish jarayoni.", "Davlatning oliy ta'lim muassasalari faoliyatini to'liq nazorat qilish va boshqaruvini mustahkamlash jarayoni.", "Ta'lim tizimini faqat moliyaviy barqarorlashtirishga qaratilgan harakatlar majmui va uning natijasi.", "Xalqaro mehnat bozoridagi talablarni e'tiborsiz qoldirib, mahalliy ta'lim standartlarini joriy etish."], ["Quyidagilardan qaysi biri matnda keltirilgan \"Tayanch tushunchalar\" ro'yxatiga KIRMADI?", "Sanoat revolyutsiyasi", "Uzluksiz ta'lim", "Innovatsion jamiyat", "Global chaqiriqlar"], ["Ta'limga kirish imkoniyatlarining tengsizligiga olib keluvchi asosiy omillar qaysilar, matnga ko'ra?", "Moliyaviy va ijtimoiy kambag'allik, qishloq xoʻjaligida yashash hamda muhojirlar va kamsitilgan xalqlar.", "Faqatgina ilg'or texnologiyalardan foydalana olmaslik va raqamli savodxonlikning past darajasi bilan bog'liq sabablar.", "Davlatning ta'limga yetarlicha investitsiya kiritmasligi va xalqaro hamkorlikning sustligi sabablari.", "Madaniy an'analarga qattiq rioya qilish va mahalliy o'quv dasturlarining cheklanganligi omillari."], ["Inklyuziv ta'limning asosiy maqsadi matnda qanday bayon etilgan?", "Barcha talabalar uchun teng ta'lim imkoniyatlarini yaratish va ularning jamiyatga integratsiyasini ta'minlash.", "Faqatgina imkoniyati cheklangan talabalarga maxsus o'quv dasturlarini joriy etish orqali ularni to'liq o'qitish.", "Ta'lim muassasalarining moliyaviy mustaqilligini oshirish va raqobatbardosh ta'lim xizmatlari bozorini shakllantirish.", "Yuqori texnologiyali o'quv muhitini yaratish va talabalarni kelajakning innovatsion iqtisodiyoti uchun tayyorlash."], ["Texnologik innovatsiyalar ta'lim sohasiga qanday ta'sir ko'rsatmoqda, matnga asosan?", "Mobil dasturlar, onlayn ta'lim, sun'iy intellekt va virtual reallik orqali ta'lim sifatini oshirish va imkoniyatlarini kengaytirish.", "O'quv jarayonlarida faqatgina an'anaviy usullarni saqlab qolishga majburlash va yangi texnologiyalarni butunlay rad etish.", "Ta'lim tizimida insoniy o'zaro aloqalarni butunlay cheklash va ijtimoiy interaktivlikni kamaytirish.", "Raqamli ko'nikmalarni o'zlashtirishga bo'lgan ehtiyojni butunlay bartaraf etish va mavjud tizimlarni o'zgarishsiz qoldirish."], ["Yevropa oliy ta'lim tizimi oldidagi global chaqiriqlardan biri bo'lgan \"innovatsion tur\" nimani anglatadi?", "Bozor talab qiladigan yuqori texnologiyali mahsulotlarni ishlab chiqarishga yo'naltirilgan va innovatsiyalarni doimiy joriy etuvchi ijtimoiy rivojlanish.", "Faqat fundamental ilmiy tadqiqotlarga e'tibor qaratish va amaliyotdan uzoqlashgan mavhum bilimlarni yaratishga intilish.", "Ta'lim sohasida ijtimoiy-siyosiy, ekologik va institutsional xavflarni to'liq bartaraf etishga qaratilgan doimiy harakatlar.", "An'anaviy ta'lim metodologiyalarini modernizatsiya qilish va ularga yangi texnologiyalarni kiritish orqali samaradorlikni oshirish."], ["Matnga ko'ra, \"bilim iqtisodiyoti\" konsepsiyasi ijtimoiy munosabatlarning asosini qanday o'zgartiradi?", "Bilimlar ijtimoiy boyliklarni takror ishlab chiqarishning asosiy omiliga aylanib, iqtisodiy qiymat yaratishda hal qiluvchi rol o'ynay boshlaydi.", "Faqat xomashyo va jismoniy mehnatga asoslangan iqtisodiyotni rivojlantirishga qaratilgan harakatlarni kuchaytiradi.", "Ta'lim xarajatlarini inson kapitaliga investitsiya deb hisoblash amaliyotini butunlay bekor qiladi va davlat xarajatlarini kamaytiradi.", "Universitetlarni faqat ilmiy tadqiqot markazlariga aylantirib, ularning ta'lim xizmatlari ko'rsatish rolini butunlay yo'qqa chiqaradi."], ["Yevropa oliy ta'lim tizimi oldidagi \"ijtimoiy institutlarni davlat tasarrufidan chiqarish\" chaqirig'ining asosiy xususiyati nima?", "Davlatning oliy ta'lim muassasalari faoliyatida ishtirok etishining kamayishi va davlat-xususiy sheriklik munosabatlarining rivojlanishi.", "Davlat tomonidan ta'lim muassasalarini to'liq moliyalashtirishni qayta tiklash va markazlashtirilgan resurslarni samarali taqsimlash.", "Oliy ta'lim tizimini to'liq davlat nazoratiga qaytarish va xususiy investitsiyalarni ta'lim sohasidan chiqarib tashlash.", "O'quv-laboratoriya bazasini yangilash va samarali qo'llab-quvvatlash uchun faqat xalqaro grantlardan foydalanishga o'tish."], ["Matnda ta'kidlanganidek, jamiyatni axborotlashtirish va ommaviy kommunikatsiyalarni virtualizatsiya qilish qanday natijalarga olib keladi?", "Ijtimoiy shovqinni interaktiv tarmoq rejimiga aylantiradi, ishtirokchilar miqdoriy tarkibini kengaytiradi va hududiy bog'lanishdan halos qiladi.", "Faqat an'anaviy, jismoniy-sensorli aloqa usullarini kuchaytiradi va raqamli muhitdan foydalanishni to'liq cheklaydi.", "Universitetlar va talabalar o'rtasidagi shaxsiy uchrashuvlarning ahamiyatini oshiradi, masofaviy ta'limni butunlay rad etadi.", "Global virtual universitetlar yaratish g'oyasini butunlay inkor etadi va faqat mahalliy ta'lim tizimlarini rivojlantirishga e'tibor qaratadi."], ["\"Istemolchilik (konsyumerizm)\" zamonaviy ijtimoiy hayotda ta'lim sohasiga qanday ta'sir ko'rsatmoqda?", "Ta'limni oddiy iste'mol tovarlari va xizmatlari qiymatiga tushirish, uning shaxs uchun o'ta qimmatli xususiyatini yo'qotish.", "Talabalar va universitetlar o'rtasidagi munosabatlarda chuqur ilmiy hamkorlik va tadqiqotga asoslangan yondashuvni shakllantirish.", "Ta'lim dasturlari mazmunini murakkablashtirish, ijodkorlikni oshirish va individual iste'molni butunlay cheklash.", "O'quv faoliyatining jozibadorligini oshirish va uning o'yinli boshlanishini butunlay yo'qqa chiqarib, qattiq akademik intizomni joriy etish."], ["Ijtimoiy taraqqiyotning, jumladan, ta'limning globallashuvi jarayoni nimaga qaratilgan?", "Ta'limni milliy bozor iqtisodiyoti manfaatlariga moslashuvi va umuminsoniy standartlarga asoslangan yagona jahon ta'lim tizimini mustahkamlash.", "Faqatgina milliy ta'lim tizimlarining avtonomiyasini kuchaytirish va xalqaro integratsiya jarayonlarini cheklash.", "Ta'limni global iqtisodiy tizimning funksional infratuzilmasidan butunlay ajratish va mahalliy talablarga qaratish.", "Aholining faqatgina ma'lum guruhlari uchun istisnosiz ta'lim imkoniyatlarini yaratish va cheklangan ixtisosliklarni rivojlantirish."], ["Globallashuv davrida ta'lim-tarbiya jarayonining asosiy vazifasi nima?", "Zamon qo'yayotgan talablarga javob berishi va mamlakatda demokratik jamiyat qurish vazifalarini amalga oshirishda hal qiluvchi ahamiyat kasb etishi.", "Faqatgina mahalliy madaniy qadriyatlarni saqlash va ularni xalqaro ta'lim standartlaridan ustun qo'yish.", "Ta'limni global iqtisodiy tizimning funksional infratuzilmasidan butunlay ajratish va mustaqil milliy tizimni yaratish.", "Asosan ta'lim muassasalarining akademik darajasini oshirishga qaratilgan va ijtimoiy taraqqiyotga hissa qo'shishni cheklash."], ["Matnda keltirilgan ta'lim siyosati yo'nalishlaridan qaysi biri inklyuzivlikni ta'minlashga qaratilgan?", "Inklyuziv ta'lim va yoshlarga muhtoj bo'lgan barcha guruhlarga teng ta'lim imkoniyatlarini berish.", "Ta'limga kirish imkoniyatlarini har tomonlama kengaytirish va umumiy qamrovni oshirish.", "Ta'limda innovatsiyalar va raqamli texnologiyalardan samarali foydalanishni ta'minlash.", "Xalqaro hamkorlik va global ta'lim tadbirlarini faol ishlab chiqish hamda joriy etish."], ["Ta'limning raqamli shakllari va yangi texnologiyalardan keng foydalanish qaysi jihatlarni o'z ichiga oladi?", "Onlayn platformalar, video saboqlar, virtual va rangli muhitlardan foydalanish, ta'lim sifatini oshirish.", "Faqat an'anaviy darsliklar va o'qitish uslublarini saqlab qolish, raqamli resurslarni butunlay rad etish.", "Universitetlar va boshqa ta'lim muassasalarining moliyaviy barqarorligini oshirishga e'tibor qaratish.", "Ta'lim xizmatlari bozorini cheklash va talabalar sonini kamaytirish, shuningdek, mahalliy tillarni himoya qilish."], ["XX asr oxirida jahon ta'lim tizimidagi \"demokratlashtirishga intilish\" tendensiyasi nimani anglatadi?", "Ta'limning hamma uchun ochiqligi, uzluksizligi va ta'lim muassasalariga mustaqillikning taqdim etilishi.", "Ta'lim tizimini to'liq markazlashtirish va barcha qarorlarni davlat nazorati ostida amalga oshirish.", "Faqatgina oliy ta'limga kirish imkoniyatlarini kengaytirish, boshlang'ich va o'rta ta'limni cheklash.", "Ma'lumot olishda ijtimoiy-iqtisodiy omillarning ta'sirini butunlay yo'q qilish va bepul ta'limni joriy etish."], ["XX asr oxiridagi global tendensiyalarga ko'ra, ma'lumot olishga qaysi omillar sezilarli ta'sir ko'rsatadi?", "Ijtimoiy-iqtisodiy omillar, xususan, pulli-shartnoma asosida tahsil olish imkoniyatlari.", "Faqatgina o'quvchining shaxsiy qiziqishlari va qobiliyatlari, tashqi ijtimoiy sharoitlardan butunlay mustaqil holda.", "Ta'lim muassasalarining geografik joylashuvi va transport infratuzilmasining rivojlanganlik darajasi.", "Xalqaro ta'lim standartlarining joriy etilishi va chet tillarni o'rganishga bo'lgan umumiy talab."], ["Ta'lim dasturlarini doimiy yangilash va modernizatsiyalashda qaysi jihatga e'tibor qaratilishi kerak, global tendensiyalarga asosan?", "O'rtacha o'zlashtirishga yo'nalganlikdan voz kechib, har bir o'quvchining o'ziga xosliklarini, qiziqishlari va qobiliyatlarini rivojlantirish.", "Umumiy o'quv dasturlarini joriy etish va talabalarning individual ehtiyojlarini to'liq e'tiborsiz qoldirish amaliyoti.", "Ta'lim xizmatlari bozorining o'sishini cheklash hamda oliy ta'lim tarmoqlarini kengaytirishdan to'liq voz kechish.", "Rivojlanishida nuqsoni bor bolalar ta'limi uchun qo'shimcha resurslarni izlashdan butunlay voz kechish."], ["Xorijiy davlatlarda ta'limni modernizatsiyalashning asosiy maqsadi nima?", "Jahon ta'lim tizimlarida samaradorlikni oshirish, innovatsiyalarni joriy etish va talabalar ehtiyojlariga javob berish.", "Har bir mamlakatning madaniy xossalarini butunlay e'tiborsiz qoldirib, yagona global ta'lim modelini joriy etish.", "Faqatgina an'anaviy o'qitish metodologiyalarini saqlab qolish va zamonaviy texnologiyalardan foydalanishni cheklash.", "Global mehnat bozorining talablarini inkor etish va milliy ta'lim tizimini xalqaro standartlardan butunlay ajratish."], ["Xorijiy davlatlarda ta'limni modernizatsiyalashning umumiy yo'nalishlariga qaysi prinsiplar kiradi?", "Zamonaviy texnologiyalar, kasbga yo'naltirilgan ta'lim, barqaror rivojlanish, ekologik ta'lim, inklyuziv va individual ta'lim.", "Faqatgina davlat nazoratini kuchaytirish, ta'lim muassasalarining avtonomiyasini cheklash va markazlashtirilgan boshqaruv.", "Mahalliy madaniy qadriyatlarni himoya qilish va xalqaro hamkorlikdan butunlay voz kechish, yagona milliy standartlarni joriy etish.", "Eskirgan o'quv dasturlarini saqlab qolish, innovatsiyalarni rad etish, shuningdek, faqat elita uchun ta'lim imkoniyatlarini yaratish."], ["Rivojlangan davlatlar tomonidan ta'limni moliyalashtirish bo'yicha XX asr oxiridagi tendensiya qanday belgilangan?", "Ta'limning rivojlangan davlatlar tomonidan moliyalashtiriladigan asosiy obyektga aylanishi.", "Ta'limga faqat mahalliy davlat byudjetidan mablag' ajratishni kuchaytirish.", "Ta'limni moliyalashtirishda xususiy sektorning rolini butunlay cheklash.", "Xalqaro donorlik va grantlar hisobiga moliyalashtirishni to'liq inkor etish."], ["Matnda keltirilgan 'ta'lim texnologiyasi' tushunchasining asosiy mazmuni nimadan iborat?", "Bu pedagogik jarayonni oldindan aniqlangan maqsadlar asosida loyihalash, tashkil etish, amalga oshirish va natijalarni baholashga yo'naltirilgan tizimli yondashuvni anglatadi.", "Bu faqat zamonaviy raqamli vositalar va platformalardan foydalanishga asoslangan uslub bo'lib, o'qituvchi ishtirokisiz kechadi.", "Bu ta'lim tizimida qo'llaniladigan har qanday texnik vositalar, jumladan, kompyuter va planshetlarning jamiyligini ifodalaydi.", "Bu o'qituvchining dars berish usullarini texnik jihozlar yordamida to'liq avtomatlashtirish va shaxsiylashtirishni bildiradi."], ["Zamonaviy ta'lim texnologiyalari an'anaviy pedagogik vositalardan tashqari yana qaysi imkoniyatlarni o'z ichiga oladi?", "Axborot-kommunikatsiya texnologiyalari, raqamli platformalar, interaktiv metodlar, multimedia, sun'iy intellekt, virtual va kengaytirilgan realliklardan foydalanishni nazarda tutadi.", "Faqatgina qog'oz asosidagi darsliklarni elektron formatga o'tkazish hamda videokonferensiya aloqalarini ta'limga joriy etishga qaratilgan amaliyotni anglatadi.", "Faqatgina o'quvchilarning bilimini sinash va baholash uchun mo'ljallangan dasturiy ta'minotlar va tizimlardan iborat bo'lgan yondashuvdir.", "O'qituvchilarning an'anaviy dars uslublarini to'liq o'zgartirib, ularni texnologiya bilan almashtirishga qaratilgan kompleks yechimdir."], ["UNESCOning ta'limda texnologiyalarga bag'ishlangan hisobotida raqamli texnologiyalar va ta'lim sifati o'rtasidagi munosabat qanday ta'kidlanadi?", "Texnologiyaning oʻzi ta'lim sifatini avtomatik ravishda ta'minlamasligi, faqatgina pedagogik maqsadlar asosida qo'llangandagina samarali vositaga aylanishi.", "Raqamli texnologiyalar ta'lim mazmunini yetkazish, boshqaruv va baholashda katta imkoniyatlarga ega ekanligi, ammo ular sifatni kafolatlay olmasligi.", "Texnologiyalar avtomatik ravishda ta'lim sifatini sezilarli darajada oshiradi, shu sababli ularni keng miqyosda joriy etish zarur hisoblanadi.", "Global miqyosdagi ta'lim monitoring hisobotlari raqamli texnologiyalar ta'lim sifatini kamaytirganini ko'rsatmoqda."], ["Zamonaviy ta'lim texnologiyalarini qo'llashning asosiy maqsadi nimadan iboratligi matnda qanday bayon etilgan?", "Oʻqituvchini texnika bilan almashtirmasdan, balki uning pedagogik imkoniyatlarini kengaytirish, o'quvchi faolligini oshirish va ta'lim natijalarini yaxshilash.", "Ta'lim jarayonini to'liq avtomatlashtirish hamda o'qituvchining vazifalarini sun'iy intellekt tizimlariga o'tkazish asosida samaradorlikka erishish.", "O'quvchilarning texnik savodxonligini oshirish va ularni raqamli qurilmalardan to'g'ri foydalanishga o'rgatishga qaratilgan asosiy yo'nalish.", "Ta'lim xarajatlarini kamaytirish va o'quv jarayoniga sarflanadigan inson resurslarini minimallashtirishga qaratilgan strategiya."], ["Matnda 'ta'lim texnologiyasi' va 'oddiy texnik vosita' o'rtasidagi farq qanday izohlanadi?", "Kompyuter texnik vosita bo'lib, uni muayyan pedagogik maqsad, metod va tashkiliy shakl bilan foydalanish ta'lim texnologiyasini tashkil etadi.", "Oddiy texnik vosita faqatgina jismoniy qurilmalardan iborat bo'lsa, ta'lim texnologiyasi esa dasturiy ta'minotlarni qamrab oladi.", "Ta'lim texnologiyasi texnik vositaning takomillashgan ko'rinishi bo'lib, uning funksional imkoniyatlarini kengaytiradi va yanada samarador qiladi.", "Texnik vosita o'qituvchisiz ishlashi mumkin, ta'lim texnologiyasi esa har doim inson ishtirokini talab qiladigan jarayondir."], ["Zamonaviy ta'lim texnologiyalarining 'maqsadga yo'naltirilganlik' xususiyati nimani anglatadi?", "Har qanday texnologiya avvalo 'Nima uchun foydalanilmoqda?' degan savolga javob berishi va o'quv maqsadiga xizmat qilishi kerak.", "Texnologiya eng yangi va ilg'or bo'lishi shart, aks holda u ta'lim jarayonida o'z samarasini ko'rsatmaydi.", "Ta'lim jarayonida texnologiyalarni joriy etishdan asosiy maqsad o'quvchilarning texnik ko'nikmalarini rivojlantirishdir.", "Texnologiya ta'lim mazmunini murakkablashtirmasligi, balki uni soddalashtirishi asosiy maqsad hisoblanadi."], ["Zamonaviy texnologiyalar ta'limni individuallashtirish imkoniyatini qanday kengaytiradi?", "O'quvchining bilim darajasi, qiziqishi va oʻzlashtirish tezligiga mos topshiriqlarni tanlash imkoniyatini taqdim etadi.", "Barcha o'quvchilar uchun bir xil, standartlashtirilgan topshiriqlarni bir vaqtda bajarishni ta'minlaydi.", "O'quvchilarning bir-biri bilan raqobatlashishiga sharoit yaratib, o'quv faoliyatini tezlashtiradi.", "Faqatgina eng qobiliyatli o'quvchilar uchun murakkabroq topshiriqlarni taqdim etishga qaratilgan uslubdir."], ["Zamonaviy texnologiyalar ko'rgazmalilik tamoyilini qanday yangi bosqichga olib chiqadi?", "Multimedia, animatsiya, video, infografika, simulyatsiya va interaktiv modellar orqali murakkab tushunchalarni tushunarliroq shaklda ifodalaydi.", "O'quvchilarning o'quv materiallari bilan bevosita ishlashiga cheklovlar qo'yib, ularni faqat videolarni kuzatishga undaydi.", "Faqatgina yuqori sifatli matnli ma'lumotlar va rasmlardan foydalanish orqali o'quvchilarning tasavvurini rivojlantiradi.", "O'quvchilarning mustaqil ravishda grafik va chizmalarni yaratish qobiliyatini rivojlantirishga qaratilgan asosiy yondashuvdir."], ["Zamonaviy texnologiyalarning pedagogik imkoniyatlaridan biri sifatida o'quvchining mustaqil ishlash imkoniyatini kengaytirish qanday tushuniladi?", "O'quvchi o'quv materialini turli formatlarda o'rganish, shuningdek, individual ta'lim trayektoriyasini shakllantirish imkoniyatiga ega bo'ladi.", "O'quvchi faqatgina o'qituvchi tomonidan belgilangan vazifalarni mustaqil bajarishi, boshqa manbalardan foydalana olmasligi ta'minlanadi.", "Texnologiya o'quvchini guruhdagi ishlarga majburlash orqali uning ijtimoiy ko'nikmalarini rivojlantirishga xizmat qiladi.", "O'quvchi mustaqil ravishda texnik qurilmalarni ta'mirlash va sozlash bo'yicha ko'nikmalarni egallashi nazarda tutiladi."], ["OECDning raqamli ta'lim ekotizimi uch asosiy qism bilan bog'liqligi qaysi elementlarni o'z ichiga oladi?", "Ta'lim tizimi va muassasalarini boshqarish vositalari, oʻqitish-oʻrganish-baholashda foydalaniladigan raqamli vositalar hamda insonlar (pedagoglar va ta'lim oluvchilar).", "Ta'lim resurslaridan samarali foydalanish, infratuzilmani rivojlantirish hamda faqat o'quvchilarning raqamli savodxonligini oshirishni o'z ichiga oladi.", "Faqatgina texnik ta'minot, internetga ulanish va turli xil elektron qurilmalar, shu bilan birga dasturiy ta'minotlarning mavjudligini anglatadi.", "O'qituvchilarning malakasini oshirish, o'quv materiallarining yangilanishi va o'quv yurtlarining moliyaviy resurslarining kengaytirilishini qamrab oladi."], ["O'qituvchining raqamli kompetensiyasi zamonaviy texnologiyalarni ta'limga joriy etishda qanday ahamiyatga ega?", "O'qituvchi texnik vositani boshqarishi, didaktik imkoniyatlarini tushunishi, maqsadga mos vosita tanlashi, faoliyatni tashkil etishi va natijalarni tahlil qilishi kerak.", "O'qituvchi faqatgina zamonaviy raqamli qurilmalarni ishlatishni bilishi kifoya, qolgan jarayonlar avtomatik tarzda amalga oshiriladi.", "O'qituvchining asosiy vazifasi texnologiyalardan umuman foydalanmaslik, balki an'anaviy dars uslublarini saqlab qolishdan iborat.", "O'qituvchi raqamli texnologiyalardan faqat baholash jarayonida foydalanib, boshqa bosqichlarda o'z bilimini namoyish etishi lozim."], ["Matnda keltirilgan 'raqamli texnologiyalar' tushunchasiga qaysi misollar kiritilgan?", "Kompyuter, planshet, smartfon, internet, elektron ta'lim platformalari, raqamli darsliklar, multimedia vositalari, videokonferensiya tizimlari, elektron baholash vositalari va sun'iy intellektga asoslangan dasturlar.", "Faqatgina qog'oz asosidagi darsliklarni, taxta va bo'rni, shuningdek, an'anaviy sinf xonalarini o'z ichiga oladigan ta'lim vositalari majmuasi.", "Faqatgina ta'lim muassasalarining ma'muriy boshqaruvi uchun mo'ljallangan dasturiy ta'minotlar va hisobot tizimlari, lekin o'qitish jarayoni bilan bog'liq emas.", "Har qanday turdagi yozma materiallar, kitoblar va jurnallar, shuningdek, ovozli yozuvlar va radiodan foydalanish, ammo zamonaviy elektron qurilmalarsiz."], ["Raqamli ta'limning muhim jihati sifatida matnda nima ko'rsatilgan?", "Ta'lim resurslaridan foydalanish imkoniyatini kengaytirish, o'quvchilarga elektron darsliklar, videolar va virtual laboratoriyalar kabi resurslardan foydalanish imkonini berish.", "O'quv jarayonini faqatgina elektron vositalar orqali olib borish va an'anaviy dars uslublaridan to'liq voz kechish, samaradorlikni oshirish.", "Ta'lim muassasalarining texnik infratuzilmasini to'liq yangilash va barcha o'quvchilarni eng zamonaviy kompyuterlar bilan ta'minlashga qaratilgan harakatlar majmui.", "O'qituvchilarning raqamli savodxonligini oshirish bo'yicha majburiy kurslar tashkil etish va ularni doimiy ravishda baholab borish tizimini joriy etish."], ["Matn bo'yicha 'raqamlashtirish' va 'raqamli transformatsiya' o'rtasidagi asosiy farq nima?", "Raqamlashtirish an'anaviy jarayonlarni elektron shaklga o'tkazish bo'lsa, transformatsiya texnologiya yordamida ta'lim jarayonining mazmuni, metodlari va tashkil etilishini tubdan takomillashtirishdir.", "Raqamlashtirish ta'lim tizimidagi barcha texnik jarayonlarni avtomatlashtirishni anglatadi, raqamli transformatsiya esa faqatgina ma'muriy ish jarayonlarini yaxshilashdir.", "Raqamli transformatsiya eski texnologiyalardan voz kechishni anglatadi, raqamlashtirish esa faqatgina yangi raqamli qurilmalarni sotib olishga qaratilgan harakatdir.", "Raqamlashtirish faqat qog'ozdagi hujjatlarni elektron ko'rinishga o'tkazishni bildirsa, raqamli transformatsiya o'qituvchilarning malakasini oshirishni ta'minlaydi."], ["Interaktiv texnologiyalarga misol sifatida matnda qaysi metodlar keltirilgan?", "Aqliy hujum, Klaster, BBB, Insert, Venn diagrammasi, Case-study, Loyiha metodi, Muammoli ta'lim, Debat, Rolga kirish, Gamifikatsiya kabi metodlar.", "O'qituvchining ma'ruza usuli, darsliklardan foydalanish, mustaqil o'qish, savol-javob, jismoniy mashqlar va yozma topshiriqlar kabi an'anaviy usullar.", "Faqatgina kompyuter dasturlari yordamida bajariladigan testlar, elektron baholash tizimlari, shuningdek, videokonferensiyalar.", "Har qanday turdagi yozma topshiriqlarni bajarish, taqdimotlar tayyorlash va individual tadqiqotlarni o'tkazishga qaratilgan uslublar majmui."], ["Gamifikatsiya, ya'ni o'yin elementlarini ta'lim jarayoniga kiritishning asosiy maqsadi nima?", "O'quvchini shunchaki o'yin bilan band qilish emas, balki o'quv faoliyatiga bo'lgan qiziqish va motivatsiyani kuchaytirish.", "O'quvchilarni raqobatga undash va ularning jismoniy faolligini oshirish orqali dars jarayoniga jalb qilish.", "Ta'lim jarayonini butunlay o'yin shakliga o'tkazish va darslikdagi jiddiy materiallarni kamaytirish orqali o'rganishni osonlashtirish.", "O'quvchilarning bo'sh vaqtlarini samarali o'tkazishlarini ta'minlash, ularga turli xil o'yinlar bilan dam olish imkoniyatini berish."], ["STEAM texnologiyasi matnda qanday ta'riflanadi?", "Fan, texnologiya, muhandislik, san'at va matematikaning integratsiyasiga asoslangan yondashuv bo'lib, oʻquvchilarning bilimlarni fanlararo bog'liq holda qoʻllashiga imkon beradi.", "Faqatgina tabiiy fanlar, texnika va matematikani o'rgatishga qaratilgan yondashuv, san'at sohasini butunlay istisno qiladi.", "Dars jarayonida faqatgina interaktiv o'yinlar va simulyatsiyalardan foydalanish orqali o'quvchilarning ilmiy-texnik bilimlarni o'zlashtirishini ta'minlaydi.", "Bu ta'limdagi eng yangi raqamli vositalar va sun'iy intellekt tizimlarini joriy etishga qaratilgan kompleks dasturlash va texnik yechimlarning yig'indisi."], ["Samarali ta'limning formulasi matnda qanday ifodalangan?", "Pedagogik maqsad + mos metod + malakali oʻqituvchi + tegishli texnologiya + teskari aloqa = samarali taʼlim.", "Ko'p texnologiya + kam o'qituvchi ishtiroki + avtomatik baholash + shaxsga yo'naltirilganlik = samarali ta'lim.", "Yangi texnologiyalar + ko'p axborot + o'quvchining mustaqil ishi + minimal o'qituvchi aralashuvi = samarali ta'lim.", "Yuqori tezlikdagi internet + zamonaviy kompyuterlar + eng so'nggi dasturlar + ma'lumotlar bazasi = samarali ta'lim."], ["Zamonaviy texnologiyalar o'quvchining bilish faolligini qanday oshiradi?", "Interaktiv topshiriqlar, elektron testlar, simulyatsiyalar va multimedia materiallari orqali o'quvchini faol harakatga undaydi.", "O'quvchilarni passiv tinglovchiga aylantiradi, ularga faqatgina tayyor ma'lumotlarni qabul qilish imkonini beradi.", "O'quvchilarning mustaqil izlanishini cheklab, ularni faqatgina o'qituvchining ko'rsatmalariga amal qilishga o'rgatadi.", "Ma'lumotlarni qiyinlashtirib, o'quvchilarning miyasini chalg'itib, ularning fikrlash qobiliyatini susaytiradi."], ["Zamonaviy texnologiyalar tezkor teskari aloqani qanday ta'minlaydi?", "Raqamli baholash vositalari orqali o'quvchi bajargan topshiriq natijalarini darhol bilib, xatosini aniqlash va tuzatish imkoniyatiga ega bo'ladi.", "O'qituvchining topshiriqni tekshirib, natijani o'quvchiga shaxsan yetkazishini kutish kerak bo'ladi, bu esa jarayonni sekinlashtiradi.", "Teskari aloqa tizimini butunlay bekor qilib, o'quvchilarning o'z-o'zini baholashiga tayanadi, bu esa noaniqliklarga olib kelishi mumkin.", "Faqatgina o'qituvchi bilan bevosita muloqot orqali teskari aloqa beriladi, texnologiya bu jarayonda ishtirok etmaydi."], ["Pedagogning raqamli-pedagogik kompetensiyasi asosan nimani anglatadi?", "Bu texnologiyani pedagogik maqsadga muvofiq tanlash, qo'llash, baholash va takomillashtirish qobiliyatini anglatadigan kengroq tushunchadir.", "Bu faqatgina texnik qurilmalarni samarali ishlatish, dasturiy ta'minotlarni o'rnatish va ularga xizmat ko'rsatish ko'nikmalarini o'z ichiga oladi.", "Bu o'qituvchining barcha ta'lim jarayonini sun'iy intellekt tizimlariga to'liq o'tkazish va o'z ishtirokini minimallashtirish qobiliyatidir.", "Bu o'qituvchining o'quvchilarga eng yangi raqamli o'yinlarni o'rgatish va ularning kompyuter savodxonligini oshirish bo'yicha maxsus bilimidir."], ["XXI asrda ta'lim jamiyat taraqqiyotini belgilovchi eng muhim strategik omil sifatida qanday talablarga javob berishi lozim?", "Ta'lim tizimlarini takomillashtirish, sifat va qamrovni oshirish, teng imkoniyatlar hamda zamonaviy kompetensiyalar shakllantirish.", "Faqatgina iqtisodiyotning raqamlashtirilishi va sun'iy intellekt rivojlanishiga moslashish, texnologik ehtiyojlarni qondirish.", "Mehnat bozoridagi kasblarning doimiy yangilanishiga mos ravishda mutaxassislarni tayyorlash, malaka oshirishni ta'minlash.", "Globallashuv jarayonlariga ko'ra o'quv dasturlarini xalqaro andozalar asosida to'liq birxillashtirish va standartlash."], ["OECDning \"Education at a Glance\" tadqiqotlari mamlakatlar ta'lim tizimlarini qaysi ko'rsatkichlar asosida qiyoslash imkonini beradi?", "Ta'limga kirish, ishtirok, moliyalashtirish, o'quv natijalari, oʻqituvchilar, oliy ta'lim va mehnat bozori natijalari kabi koʻrsatkichlar.", "Maktabgacha ta'lim qamrovi, raqamli savodxonlik darajasi, chet tillarini bilish darajasi va talabalarning kasbiy ko'nikmalari.", "Ta'lim muassasalari soni, o'quvchilar soni, pedagoglarning umumiy malakasi, ijtimoiy-iqtisodiy rivojlanish darajasi.", "Xalqaro reytinglardagi o'rni, ta'lim tizimidagi investitsiyalar hajmi, ilmiy-tadqiqot ishlari va innovatsion faoliyat samaradorligi."], ["Bugungi kunda ta'lim rivojining asosiy mezoni faqat ta'lim muassasalari soni yoki o'quvchilar qamrovi bilan belgilanmaydi, balki yana nimalar bilan baholanadi?", "O'quvchilarning real bilim va ko'nikmalari, ta'limdagi tenglik, pedagoglarning kasbiy salohiyati, ta'limning mehnat bozori bilan uyg'unligi va inson kapitalini rivojlantirish.", "Maktablarning texnik jihozlanishi, zamonaviy axborot texnologiyalardan foydalanish darajasi, o'qituvchilarning o'rtacha yoshi va xizmat staji.", "Davlat budjetidan ta'limga ajratilgan mablag'lar hajmi, xalqaro grantlarni jalb qilish imkoniyatlari va ta'lim sohasidagi xalqaro hamkorlik.", "O'quvchilarning darslarga qatnashish intizomi, o'qituvchilarning soni va ularning malaka toifalari, ta'lim muassasalarining moliyaviy barqarorligi."], ["\"Ta'lim qamrovini kengaytirish\" tendensiyasida hozirgi davrda asosiy vazifa nimadan iborat?", "Ta'limga kirishni kengaytirish bilan birga, uning sifatini va natijadorligini ta'minlash.", "Boshlang'ich va o'rta ta'limga qamrovni sezilarli darajada oshirish, barcha bolalarni maktabga jalb qilish.", "Ta'lim muassasalarining sonini ko'paytirish va ta'lim tizimini geografik jihatdan kengaytirish.", "Ta'limdan tashqarida qolgan bolalar va o'smirlarning umumiy sonini keskin kamaytirish."], ["\"Ta'lim sifatiga e'tiborning kuchayishi\" tendensiyasi ta'lim siyosatidagi qanday muhim o'zgarishni anglatadi?", "\"Qancha bola maktabga qatnamoqda?\" savolidan \"o'quvchi maktabda nimani o'rgandi va uni real hayotda qanday qo'llay oladi?\" savoliga o'tish.", "Faqatgina o'quv dasturlarini yangilash va o'quv materiallarini zamonaviylashtirish orqali ta'lim sifatini oshirish.", "Xalqaro miqyosdagi baholash tadqiqotlarida yuqori natijalarga erishishni asosiy maqsad qilib qo'yish va shunga intilish.", "O'qituvchilarning malakasini oshirish va ularning kasbiy salohiyatini doimiy monitoring qilish tizimini yaratish."], ["Kompetensiyaga asoslangan ta'lim o'quvchilarda qanday muhim ko'nikmalarni shakllantirishga yo'naltirilgan?", "Tanqidiy fikrlash, muammoni hal qilish, muloqot qilish, hamkorlikda ishlash, ijodkorlik, raqamli savodxonlik va mustaqil ta'lim olish.", "Faqatgina faktlarni yodlab qolish, qoidalarni eslab qolish va ularni darslik materiallari asosida takrorlash.", "Ta'lim tizimidagi fanlarning barcha yo'nalishlari bo'yicha chuqur nazariy bilim olish va ularni amaliyotga tatbiq etish.", "Raqamli texnologiyalardan samarali foydalanish, internet tarmog'idan axborot izlash va uni tahlil qilish."], ["Raqamli ta'lim texnologiyalaridan samarali foydalanish uchun qanday asosiy shartlar ta'minlanishi lozim?", "Pedagogik maqsad, metodik asos, o'qituvchi kompetensiyasi va raqamli tenglik ta'minlanishi.", "Texnologik imkoniyatlarni kengaytirish, zamonaviy qurilmalar va yuqori tezlikdagi internetga to'liq qamrov.", "Sun'iy intellekt va adaptiv ta'lim tizimlarining to'liq joriy etilishi, virtual laboratoriyalardan foydalanish.", "Elektron ta'lim platformalarini yaratish, videodarslar sonini oshirish va masofaviy o'qitish tizimlarini rivojlantirish."], ["\"Inklyuziv va adolatli ta'limni rivojlantirish\" tendensiyasining markaziy g'oyasi nimadan iborat?", "Barcha bolalarning, ijtimoiy kelib chiqishi, yashash hududi, iqtisodiy imkoniyati yoki individual ehtiyojlaridan qat'i nazar, sifatli ta'lim olishi.", "Ta'lim muassasalarida nogironligi bo'lgan shaxslar uchun maxsus sharoitlar yaratish va ularga alohida yondashuvni ta'minlash.", "Ta'limdagi tengsizlikni faqatgina moddiy resurslarni ehtiyojmand guruhlarga yo'naltirish orqali kamaytirish va moliyaviy qo'llab-quvvatlash.", "Ta'limga kirish imkoniyatlarini hududlar bo'yicha tenglashtirish va barcha fuqarolar uchun ta'lim xizmatlaridan foydalanishni ta'minlash."], ["Maktabgacha ta'limga e'tiborning ortishi sababi nimada, ilmiy tadqiqotlar qaysi jihatni ko'rsatmoqda?", "Bolaning dastlabki rivojlanish davrida shakllangan kognitiv, kommunikativ va ijtimoiy ko'nikmalarning uning keyingi ta'limiga ta'siri.", "Maktab yoshidagi bolalarning o'qishga bo'lgan qiziqishini oshirish va ularda maktabga tayyorgarlik darajasini oshirish.", "Maktabgacha ta'lim muassasalari sonini ko'paytirish va barcha bolalarni maktabgacha ta'lim bilan qamrab olishni ta'minlash.", "Ota-onalar ish bilan bandligini ta'minlash va bolalarni maktabgacha ta'lim tizimi orqali nazorat qilish."], ["Kasbiy va oliy ta'limni mehnat bozori bilan integratsiyalash uchun qanday mexanizmlar rivojlanmoqda?", "Dual ta'lim, ishlab chiqarish amaliyoti, stajirovka, loyiha asosida ta'lim va ish beruvchilar bilan hamkorlik.", "Oliy ta'lim muassasalarida yangi kasbiy yo'nalishlarni ochish va bitiruvchilarga faqat nazariy bilim berish.", "Bitiruvchilarning ishga joylashishiga kafolat berish va mehnat bozoridagi barcha vakant o'rinlarni ta'minlash.", "Kasbiy ta'limni faqat oliy ta'limga kira olmagan o'quvchilar uchun yo'nalish sifatida ko'rish."], ["\"Umrbod ta'lim konsepsiyasi\"ning asosiy maqsadi zamonaviy mehnat bozorida insonlarga qanday imkoniyatlarni berish?", "Insonning yangi bilim va ko'nikmalarni muntazam egallashi, doimiy ravishda qayta tayyorlanishi va malaka oshirishi.", "Bir marta kasb egallab, butun faoliyati davomida shu bilim bilan cheklanib qolish imkoniyatini yaratish.", "Faqatgina yoshlik davrida maktab yoki universitetda tugaydigan ta'lim jarayonini davom ettirish.", "Mehnat bozorida yuqori talabga ega bo'lgan faqatgina mutaxassisliklarni o'zlashtirish."], ["Rivojlangan mamlakatlarning ta'lim tizimlariga xos bo'lgan muhim jihatlardan biri sifatida nima ko'rsatilgan?", "Ta'lim infratuzilmasining nisbatan rivojlanganligi va ma'lumotlarga asoslangan boshqaruvning keng qo'llanilishi.", "Ta'lim qamrovi va moliyalashtirishdagi jiddiy muammolar, o'qituvchilar yetishmovchiligi.", "Ta'lim tizimining samaradorligini faqat o'quvchilar soni va muassasalar soni bilan belgilash.", "Kasbiy ta'limni faqat oliy ta'limga kira olmagan o'quvchilar uchun yo'nalish sifatida ko'rish."], ["Rivojlanayotgan mamlakatlarda ta'lim tizimining asosiy muammolari ko'pincha nimalar bilan bog'liq bo'ladi?", "Ta'lim qamrovi, moliyalashtirish, infratuzilma, o'qituvchilar yetishmovchiligi, hududlar o'rtasidagi tafovut va ta'lim sifati.", "Raqamli ta'lim texnologiyalaridan to'liq foydalana olmaslik, sun'iy intellektning sust rivojlanganligi.", "Maktabgacha ta'limga e'tiborning yo'qligi va umrbod ta'lim konsepsiyasining sust rivojlanganligi.", "Xalqaro baholashlarda doimiy yuqori natijalarga erishish va pedagoglarning kasbiy malakasini oshirish."], ["Qiyosiy tahlilga ko'ra, ta'lim tizimlarining samaradorligiga ta'sir ko'rsatuvchi muhim omillardan biri qaysi?", "Malakali o'qituvchilarni tayyorlash va ularni qo'llab-quvvatlash tizimini yaratish.", "Faqatgina ta'lim muassasalarining moddiy-texnik bazasini to'liq yangilash va takomillashtirish.", "Xalqaro baholash tizimlarida (PISA, TIMSS) yuqori o'rinlarni egallashga erishish.", "Ta'lim tizimiga kiritilgan moliyaviy resurslarning miqdorini doimiy oshirib borish."], ["Jahon ta'lim tajribasini o'rganishda \"ko'chirish\" emas, balki \"moslashtirish\" tamoyili muhimligi nimani anglatadi?", "Boshqa mamlakatlar tajribasini aynan takrorlamasdan, ularning samarali mexanizmlarini milliy sharoitga uyg'unlashtirish.", "Xalqaro pedagogik modellarni o'zgartirmasdan to'g'ridan-to'g'ri o'z ta'lim tizimiga joriy etish.", "Har bir mamlakatning o'ziga xos ta'lim tizimini yaratish, xalqaro tajribalarni inkor etish.", "Faqatgina iqtisodiy jihatdan rivojlangan mamlakatlarning ta'lim tajribasini o'rganish va undan foydalanish."], ["O'zbekiston uchun ta'lim sifatini xalqaro mezonlar asosida takomillashtirishda qanday jihatlarga e'tibor qaratilishi lozim?", "O'quvchilarning funksional savodxonligi, muammoli vaziyatlarda bilimni qo'llashi, tanqidiy fikrlashi va mustaqil qaror qabul qilishi.", "Faqatgina o'quvchilarning nazariy bilimlarni yodlab qolish darajasini oshirish va ularni imtihonlarda yuqori natijalar bilan baholash.", "Xalqaro baholashlarda (PISA, TIMSS) O'zbekistonning o'rnini ko'tarishga qaratilgan maxsus dasturlarni amalga oshirish.", "Ta'lim muassasalarining texnik jihozlanishini yaxshilash va o'qitish jarayoniga zamonaviy texnologiyalarni joriy etish."], ["O'zbekistonda kompetensiyaviy ta'limni rivojlantirish uchun o'quv dasturlarida qanday kompetensiyalarni shakllantirishga e'tibor berish zarur?", "Kommunikativ, raqamli, ijtimoiy, tadqiqotchilik va muammolarni hal qilish kompetensiyalarini shakllantirish.", "Faqatgina ma'lum bir kasbga yo'naltirilgan tor ixtisoslik bilimlari va amaliy ko'nikmalarini chuqurlashtirish.", "O'quvchilarda milliy qadriyatlarga hurmatni shakllantirish va ularni vatanparvarlik ruhida tarbiyalash.", "Xorijiy tillarni o'rganish, jahon madaniyatini o'rganish va xalqaro muloqot ko'nikmalarini rivojlantirish."], ["O'zbekistonda ta'lim boshqaruvida ma'lumotlarga asoslangan qaror qabul qilish tizimi qaysi ma'lumotlarga tayanishi lozim?", "O'quv natijalari, pedagoglar faoliyati, moliyaviy ko'rsatkichlar, ta'limdagi tenglik va bitiruvchilar faoliyati haqidagi ishonchli ma'lumotlar.", "Faqatgina ta'lim muassasalarining shtat birliklari, o'qituvchilarning ish yuklamalari va o'quvchilar soni haqidagi statistik ma'lumotlar.", "Hududlardagi maktablarning geografik joylashuvi, ularning moddiy-texnik bazasi va ta'lim xizmatlari narxlari haqidagi ma'lumotlar.", "Xalqaro reytinglarda O'zbekistonning o'rni, ta'lim sohasidagi xorijiy investitsiyalar va xalqaro loyihalar hajmi."], ["O'zbekiston uchun xalqaro tajribadan foydalanishning maqbul modeli qanday bosqichlarni o'z ichiga oladi?", "Xalqaro tajribani o'rganish → qiyosiy tahlil → milliy sharoitga moslashtirish → tajriba-sinovdan o'tkazish → natijalarni baholash → samarali modelni joriy etish.", "Xalqaro tajribani to'g'ridan-to'g'ri ko'chirish → mahalliy sharoitlarda sinab ko'rish → baholash → joriy etish.", "Milliy ta'lim tizimini to'liq modernizatsiya qilish → xalqaro standartlarga moslashtirish → global ta'lim modelini joriy etish.", "Xorijiy ekspertlarni jalb qilish → loyiha tayyorlash → pilot sinovdan o'tkazish → keng miqyosda joriy etish."], ["Xulosa qismiga ko'ra, ta'lim tizimining rivojlanganlik darajasi qanday asosiy omil bilan belgilanadi?", "Moddiy resurslar va o'quvchilar sonini inson kapitalini rivojlantirishga qanchalik samarali aylantirilayotgani bilan.", "Faqatgina davlat tomonidan ta'limga ajratilgan moliyaviy resurslarning umumiy hajmi va ularning o'sish sur'atlari bilan.", "Ta'lim muassasalarining soni va ulardagi o'quvchilarning umumiy qamrovi darajasi bilan.", "Xalqaro ta'lim reytinglarida egallagan o'rni va global ta'lim ko'rsatkichlariga mos kelishi bilan."], ["Ta'lim texnologiyasi tushunchasi pedagogik jarayonni qanday yondashuv sifatida anglatadi?", "Pedagogik jarayonni oldindan belgilangan maqsadlar asosida loyihalashtirish, tashkil etish, amalga oshirish va natijalarni baholashga qaratilgan tizimli yondashuvni.", "Zamonaviy axborot-kommunikatsiya vositalaridan faol foydalanishga yoʻnaltirilgan bir qator interaktiv usullarni qamrab oluvchi keng yondashuvni.", "O'quvchilarga yangi bilimlarni mustaqil o'zlashtirish uchun mavjud bo'lgan barcha texnik resurslarni taqdim etuvchi amaliy jarayonni.", "O'qituvchi tomonidan qo'llaniladigan har qanday raqamli vositalarning umumiy majmuasi va ularni o'quv dasturlariga moslashtirishni."], ["Zamonaviy ta'lim texnologiyalarining asosiy maqsadi matnda qanday bayon etilgan?", "O'qituvchini texnika bilan almashtirish emas, balki uning pedagogik imkoniyatlarini kengaytirish, o'quvchi faolligini oshirish hamda natijalarni yaxshilash.", "O'quvchilarni zamonaviy texnik qurilmalardan samarali foydalanishga o'rgatish, ularning raqamli savodxonligini yanada oshirishga qaratilgan.", "Ta'lim jarayonini to'liq avtomatlashtirish, inson aralashuvisiz yuqori sifatli va tezkor bilim olish imkoniyatini yaratish.", "An'anaviy ta'lim usullaridan butunlay voz kechish, ularning o'rniga faqat interaktiv va raqamli platformalarni joriy etish."], ["Ta'lim texnologiyasi va oddiy texnik vosita oʻrtasidagi farqni quyidagi qaysi ta'rif eng aniq ifodalaydi?", "Texnik vosita muayyan pedagogik maqsad va metod bilan birgalikda qo'llanilganda ta'lim texnologiyasiga aylanadi, aks holda u shunchaki vosita.", "Oddiy texnik vosita faqat axborotni uzatish uchun ishlatiladi, ta'lim texnologiyasi esa o'quvchining motivatsiyasini oshirishga xizmat qiladi.", "Ta'lim texnologiyasi har doim internetga ulangan bo'ladi, oddiy texnik vosita esa bunday talabga javob bermasligi mumkin.", "Oddiy texnik vosita shaxsiy foydalanish uchun mo'ljallangan, ta'lim texnologiyasi esa faqat jamoaviy ta'lim jarayonlarida qo'llaniladi."], ["Zamonaviy ta'lim texnologiyalarining muhim xususiyati sifatida matnda nima koʻrsatilgan?", "Maqsadga yo'naltirilganlik, ya'ni har qanday texnologiya aniq ta'lim maqsadiga xizmat qilishi zarur, aks holda u samarasiz bo'ladi.", "Yuqori texnologiyali bo'lishi, eng so'nggi dasturiy ta'minot va apparat vositalaridan foydalanishi asosiy mezon hisoblanadi.", "Barcha o'quvchilar uchun bir xil darajada bilim olish imkoniyatini ta'minlashi, bu esa ta'limda tenglikni yaratishi kerak.", "O'qituvchining texnik jihatdan mustaqilligini oshirishi, ya'ni ta'lim jarayonini avtomatik tarzda boshqarishiga imkon berishi."], ["UNESCOning ta'limda raqamli texnologiyalar va ta'lim sifati borasidagi pozitsiyasi qanday?", "Raqamli texnologiyalar katta imkoniyatlarga ega, biroq ularning o'zi ta'lim sifatini avtomatik ravishda ta'minlamaydi, deyiladi.", "Raqamli texnologiyalardan keng foydalanish ta'lim sifatini kafolatlaydigan yagona va eng samarali yo'l ekanligini ta'kidlaydi.", "Texnologiya faqat rivojlangan mamlakatlardagi ta'lim sifatini oshirishga xizmat qiladi, rivojlanayotgan mamlakatlarga samara bermaydi.", "Ta'lim sifatini oshirishda texnologiyaning o'rni ikkinchi darajali bo'lib, eng muhimi an'anaviy pedagogik yondashuvlar hisoblanadi."], ["Samarali ta'lim formulasi matnda keltirilganidek, qaysi elementlar majmuasidan iborat?", "Pedagogik maqsad, mos metod, malakali oʻqituvchi, tegishli texnologiya va tezkor teskari aloqa kabi beshta muhim komponentdan.", "Oʻquvchining individual ehtiyojlari, yangi texnik vositalar, interaktiv resurslar hamda virtual va kengaytirilgan realliklardan.", "An'anaviy ta'lim materiallari, raqamli platformalar, oʻqituvchining yuqori texnik bilimlari va tezkor axborot almashinuvidan.", "Zamonaviy infratuzilma, yuqori tezlikdagi internet, barcha o'quvchilar uchun bir xil texnologik ta'minot va avtomatik baholashdan."], ["Raqamlashtirish (digitization) tushunchasi matnda asosan nimani anglatadi?", "An'anaviy jarayonlarni elektron shaklga o'tkazish bilan cheklanishi, masalan, qog'oz darslikni PDF formatida taqdim etishni.", "Ta'lim jarayonining mazmuni, metodlari va tashkil etilishini tubdan takomillashtirishni, buning uchun texnologiyadan foydalanishni.", "Barcha o'quv muassasalarini eng so'nggi raqamli uskunalar bilan jihozlashni, ularni doimiy yangilab borishni.", "O'qituvchilarning raqamli savodxonligini oshirish bo'yicha maxsus kurslar tashkil etishni va ularning kompetensiyalarini baholashni."], ["Raqamli transformatsiya (digital transformation) ta'lim jarayoni uchun nimani nazarda tutadi?", "Texnologiya yordamida ta'lim jarayonining mazmuni, metodlari va tashkil etilishini tubdan takomillashtirishni.", "An'anaviy ta'lim resurslarini shunchaki elektron shaklga o'tkazish va ulardan masofaviy foydalanish imkoniyatini ta'minlashni.", "Ta'limda raqamli vositalarning sonini imkon qadar ko'paytirish va har bir o'quvchiga shaxsiy kompyuter taqdim etishni.", "Ta'lim muassasalarida raqamli xizmatlar ko'rsatuvchi yagona markaz tashkil etish, bu markaz orqali barcha jarayonlarni boshqarishni."], ["Zamonaviy texnologiyalar 'ta'limni individuallashtirish' tamoyilini qanday qo'llab-quvvatlaydi?", "O'quvchining bilim darajasi, qiziqishi va oʻzlashtirish tezligiga mos topshiriqlarni tanlash imkoniyatini kengaytirib, differensial yondashuvni ta'minlaydi.", "Barcha o'quvchilarga bir xil standart topshiriqlarni bir xil vaqtda bajarishni talab qilib, adolatli va teng baholash tizimini yaratadi.", "O'qituvchining har bir o'quvchiga shaxsan e'tibor berishini kamaytirib, avtomatlashtirilgan ta'lim jarayonlarini yanada soddalashtiradi.", "O'quvchilar orasidagi raqobatni kuchaytirish maqsadida ularning tezkorligi va bilim darajasini doimiy ravishda umumiy reytingda aks ettiradi."], ["Zamonaviy texnologiyalar 'koʻrgazmalilik tamoyili'ni qanday yangi bosqichga olib chiqadi?", "Multimedia materiallari, animatsiya, video, infografika, simulyatsiya va interaktiv modellar orqali murakkab tushunchalarni oʻquvchi uchun tushunarli qilish orqali.", "Faqatgina yuqori sifatli matnli darsliklar va o'qituvchining jonli ma'ruzalari orqali bilim berish usulini yanada takomillashtirish orqali.", "O'quvchilarning tasavvur qilish qobiliyatini rivojlantirish uchun ularga faqat og'zaki ma'lumotlarni berish va ularning xayolotini ishga solish orqali.", "Barcha o'quv materiallarini faqatgina qora-oq ranglarda taqdim etish va ularni iloji boricha soddalashtirish orqali."], ["Matnda keltirilgan interaktiv texnologiya metodlariga qaysilar kiritilgan?", "“Aqliy hujum”, “Klaster”, “BBB”, “Insert”, “Venn diagrammasi”, “Case-study” va “Gamifikatsiya” kabi metodlar.", "Faqatgina o'qituvchi markazida bo'lgan ma'ruzalar, amaliy mashg'ulotlar, laboratoriya ishlari va mustaqil yozma ishlar.", "O'quvchilarni faqatgina yakka tartibda ishlashga undovchi testlar, so'rovnomalar va yakuniy imtihonlar tizimi.", "Darsliklarni yodlash, o'qituvchi savollariga to'g'ri javob berish va yuqori baho olishga qaratilgan usullar."], ["Gamifikatsiya metodining ta'lim jarayonidagi asosiy maqsadi nimadan iborat?", "O'quvchini shunchaki o'yin bilan band qilish emas, balki uning o'quv faoliyatiga bo'lgan qiziqishi va motivatsiyasini kuchaytirishdir.", "O'quvchilarni ta'lim jarayonida faqatgina o'yin o'ynashga jalb qilish orqali ularning akademik yukini kamaytirishdir.", "O'quvchilar orasida raqobatni kuchaytirib, ularni bir-birlaridan o'zib ketishga undash va eng yaxshilarni aniqlashdir.", "O'quvchilarni real hayot muammolaridan chalg'itib, ularni virtual dunyoga ko'proq jalb qilishni ta'minlashdir."], ["Loyiha texnologiyasi metodi asosan qaysi kompetensiyalarni rivojlantirishga qaratilgan?", "Kommunikativ, tadqiqotchilik, ijodiy va tashkilotchilik kompetensiyalarini rivojlantirishga qaratilgan.", "Faqatgina mantiqiy fikrlash va yodlash qobiliyatini mustahkamlashga qaratilgan bo'lib, amaliyotda foydali emas.", "O'quvchining jismoniy chidamliligini va jamoada raqobatlashish qobiliyatini oshirishga yo'naltirilgan.", "Faqatgina yakka tartibdagi mustaqil ishlash ko'nikmalarini rivojlantirishga, jamoaviy ishlarga ahamiyat bermaydi."], ["STEAM texnologiyasining ta'limdagi asosiy prinsipi nimadan iborat?", "Fan, texnologiya, muhandislik, san'at va matematikaning integratsiyasiga asoslangan yondashuv bo'lib, fanlararo bog'liqlikni ta'minlaydi.", "Har bir fanni alohida, chuqur o'rganishga qaratilgan bo'lib, ularning o'zaro bog'liqligini inkor etadi.", "Asosan san'at va ijodiy fanlarga e'tibor qaratilib, aniq fanlarning ahamiyatini ikkinchi darajali deb bilishdir.", "Texnik bilimlar va kompyuter savodxonligini oshirishga yo'naltirilgan bo'lib, boshqa fanlar bilan bog'liqlikni rad etadi."], ["Sun'iy intellekt texnologiyalari ta'limda qanday imkoniyatlarni taqdim etmoqda?", "O'quv materiallarini moslashtirish, savollarga javob berish, matn yaratish, o'quvchi faoliyatini tahlil qilish va individual ta'limni qo'llab-quvvatlash imkoniyatlarini.", "Faqatgina an'anaviy darsliklarni raqamli formatga o'tkazish, ularni internetda keng tarqatish va hamma uchun ochiq qilish imkoniyatlarini.", "O'qituvchining o'rnini to'liq egallash, ta'lim jarayonini inson aralashuvisiz to'liq avtomatlashtirish va boshqarish imkoniyatini.", "O'quvchilarga to'g'ri javoblarni tayyor holda taqdim etish, ularning mustaqil fikrlash va izlanish qobiliyatini cheklash imkoniyatlarini."], ["UNESCOning texnologiyaning ta'limdagi insoniy munosabatlarga ta'siri borasidagi pozitsiyasi qanday?", "Texnologiya insoniy munosabatlarni almashtirish uchun emas, balki ularni qo'llab-quvvatlash va ta'lim imkoniyatlarini kengaytirish uchun xizmat qilishi kerak.", "Texnologiya insoniy munosabatlarni to'liq almashtirishi va ta'lim jarayonida o'qituvchi va o'quvchi o'rtasidagi to'g'ridan-to'g'ri aloqani kamaytirishi lozim.", "Insoniy munosabatlar ta'limda texnologiyaning samaradorligini pasaytiradi, shuning uchun ularni iloji boricha cheklash kerak.", "Texnologiyadan foydalanish insoniy munosabatlarni butunlay yo'qotib, o'quvchilarda ijtimoiy ko'nikmalarni rivojlanishiga salbiy ta'sir ko'rsatadi."], ["O'qituvchining zamonaviy texnologiyalar bilan boyitilgan ta'lim jarayonidagi asosiy roli nimada?", "Asosiy pedagogik subyekt boʻlib qolishi, ta'lim jarayonini loyihalash, oʻquvchilar faoliyatini monitoring qilish va individual yondashuvni amalga oshirishi.", "Texnik qurilmalarni boshqarish va ularning ishlashini nazorat qilish bilan cheklanishi, pedagogik vazifalarni esa texnologiyalarga topshirishi.", "O'quvchilarga tayyor bilimlarni taqdim etishi, ularning mustaqil izlanishini cheklashi va barcha javoblarni o'qituvchidan kutishga undashi.", "Ta'lim jarayonini to'liq avtomatlashtirish, inson aralashuvisiz yuqori sifatli va tezkor bilim olish imkoniyatini yaratish."], ["Zamonaviy pedagogning kasbiy kompetensiyasi tarkibida 'raqamli-pedagogik kompetensiya' nimani anglatadi?", "Texnik qurilmani ishlatishdan ko'ra kengroq tushuncha boʻlib, texnologiyani pedagogik maqsadga muvofiq tanlash, qoʻllash, baholash va takomillashtirish qobiliyatini.", "Faqatgina kompyuter va internetdan samarali foydalanish, darsliklarni raqamli formatga o'tkazish hamda baholash tizimini avtomatlashtirish qobiliyatini.", "O'qituvchining yuqori darajadagi dasturlash ko'nikmalariga ega bo'lishi, murakkab dasturiy ta'minotlarni yaratishi va ularni ta'limda qo'llashi qobiliyatini.", "Barcha o'quvchilarni bir xil darajada raqamli texnologiyalardan foydalanishga o'rgatish, ularning texnik xatolarini to'g'irlash va dasturlash tillarini o'rgatish qobiliyatini."], ["Zamonaviy texnologiyalardan foydalanishdagi asosiy muammolar qaysilar?", "Raqamli tengsizlik, texnik infratuzilmaning yetarli emasligi, o'qituvchilarning raqamli kompetensiyasi turlichaligi, axborot xavfsizligi masalalari.", "O'quvchilarning texnologiyaga haddan tashqari bog'lanib qolishi, real muloqot ko'nikmalarining pasayishi va ijtimoiy izolyatsiya.", "O'quv materiallarining haddan tashqari murakkabligi, o'qituvchilarning motivatsiyasining yetarli emasligi va o'quvchilarning baho tizimidan noroziligi.", "Hukumat tomonidan texnologiyalarni ta'limga joriy etishga yetarli darajada e'tibor berilmasligi, moliyaviy resurslarning cheklanganligi va ta'lim siyosatining o'zgaruvchanligi."], ["OECDning raqamli ta'lim bo'yicha tahlillarida ta'lim tizimlari qanday yondashuvga intilishi qayd etilgan?", "Oddiy raqamlashtirishdan kengroq boʻlgan raqamli transformatsiyaga intilishi, yagona raqamli ekotizim sifatida qaralishi.", "Faqatgina mavjud an'anaviy ta'lim metodlarini raqamli vositalar bilan to'ldirishga, lekin ularning asosiy tuzilishini o'zgartirmaslikka.", "Barcha ta'lim jarayonlarini inson aralashuvisiz avtomatlashtirishga, o'qituvchilarning o'rnini sun'iy intellektga topshirishga.", "Raqamli texnologiyalardan iloji boricha kamroq foydalanishga, chunki ular ta'lim sifatini pasaytirishi va o'quvchilarni chalg'itishi mumkin."], ["Ta'lim natijalarini monitoring qilish zamonaviy texnologiyalarning qaysi imkoniyatiga kiradi?", "Ushbu texnologiyalar oʻquvchilarning oʻzlashtirish jarayonini doimiy kuzatish va baholash, samaradorlikni oshirish uchun tezkor choralar ko'rish imkonini beradi.", "Bu texnologiyalar asosan o'qituvchining ish yukini kamaytirishga qaratilgan bo'lib, o'quvchilarning baholarini avtomatik tarzda shakllantirishga yordam beradi.", "Ta'lim natijalarini monitoring qilish faqatgina yakuniy imtihonlar orqali amalga oshiriladi va texnologiyalar bu jarayonga to'g'ridan-to'g'ri ta'sir ko'rsatmaydi.", "Bu imkoniyat asosan o'quvchilarni bir-birlari bilan taqqoslash, ularning raqobatbardoshligini oshirish va faqat eng yaxshilarini aniqlashga xizmat qiladi."]]}, {"name": "Jismoniy tarbiya gigiyenasi va sportning tibbiy-fiziologik", "q": [["Matnga koʻra, adaptatsiya (moslashish) tushunchasi organizmning qanday jarayonini ifodalaydi?", "Organizmning takroriy taʼsirlarga javoban oʻz tuzilishi va funksiyalarini qayta qurishi, zoʻriqishni kamaytirishdir.", "Tashqi muhit sharoitlariga tezkor, birdaniga yuzaga keladigan fiziologik oʻzgarishlarni anglatadi.", "Ichki muhit koʻrsatkichlarini doimiy ravishda tor funksional chegaralarda saqlash mexanizmidir.", "Organizmning faqatgina jismoniy yuklamalarga nisbatan oʻzgaruvchan javob berish qobiliyatidir."], ["Allostaz atamasi nimani anglatadi va u qachon, kimlar tomonidan taklif etilgan?", "Organizmning kutilayotgan talabga oldindan tayyorlanib, “oʻzgarish orqali barqarorlik”ni ifodalaydi, 1988-yilda P. Sterling va J. Eyer taklif etgan.", "Ichki muhitning doimiy barqarorligini taʼminlash mexanizmi boʻlib, 1929-yilda Uolter Kennon tomonidan kiritilgan.", "Faqat tashqi muhitning keskin oʻzgarishlariga nisbatan organizmning tezkor moslashuvini anglatadi.", "Jismoniy yuklamalarga nisbatan mushaklar tolalarining kattalashuvi boʻlib, 1967-yilda Jon Holloszy tomonidan kashf qilingan."], ["Gans Selye 1936-yilda organizmning turli zararli omillarga javoban yuzaga keladigan qaysi sindromni koʻrsatgan?", "Umumiy adaptatsion sindromni uch bosqich (tashvish, rezistentlik va holdan toyish) bilan tavsiflagan.", "Dizadaptatsiya sindromini, ayniqsa nofunksional ortiqcha yuklanish holatini tushuntirgan.", "Overtraining sindromining tashxisi va davolash usullarini birinchi boʻlib ilmiy asoslagan.", "Ichki muhit koʻrsatkichlarining funksional chegaralarda saqlanishini taʼriflagan."], ["Mashq adaptatsiyasining \"Spetsifiklik\" qonuniyati nimani anglatadi?", "Moslashuv bajarilgan mashq turi va faol ishlagan toʻqimalarga mos yuzaga kelishini anglatadi.", "Yuklama organizm uchun odatiy darajadan yetarlicha yuqori boʻlishini talab etadi.", "Tayyorgarlik oshgan sari yuklama ehtiyotkorlik bilan oshirib borilishini ifodalaydi.", "Stimul kamaysa yoki toʻxtasa, erishilgan moslashuvning bir qismi yoʻqolishi tushunchasidir."], ["Tezkor fiziologik javobning dastlabki soniyalarida energiya taʼminotida qaysi moddalar asosiy rol oʻynaydi?", "Adenozintrifosfat (ATF) va kreatinfosfat hisobiga energiya taʼminlanishi sodir boʻladi.", "Glikogen va yogʻlarning safarbar qilinishi energiyaning asosiy manbai hisoblanadi.", "Oqsil almashinuvi va gen ifodasining oʻzgarishi energiyani taʼminlashga yordam beradi.", "Kislorodning ishlayotgan mushaklarga etkazilishi tezkor energiya manbai vazifasini bajaradi."], ["Mashqdan keyingi soatlarda oqsil almashinuvi va gen ifodasini boshqarishda qaysi signal yoʻllari faol ishtirok etadi?", "Kalsiy ionlari, AMPK, CaMK, MAPK va mTOR signal yoʻllari muhim rol oʻynaydi.", "Faqat simpatik asab tizimining faollashuvi va motor birliklarining safarbar etilishi.", "Glikogen va yogʻlarning tezkor safarbar qilinishi bu jarayonlarni toʻliq boshqaradi.", "Eritropoetin ishlab chiqarilishi va kislota-ishqor muvozanatining tiklanishi asosiy mexanizmdir."], ["Uzoq muddatli moslashuv jarayoni qanday zanjir koʻrinishida kechadi?", "Stimul → signallar → qayta qurilish → yangi funksional holat koʻrinishidagi murakkab zanjirdir.", "Faqatgina asab tizimi orqali uzatiladigan signallar orqali tezkor javobni oʻz ichiga oladi.", "Dastlabki tiklanish va tezkor safarbarlik bosqichlarini qatʼiy ketma-ketlikda oʻz ichiga oladi.", "Hujayraviy darajadagi energiya tanqisligi va kalsiy signallarining bevosita taʼsiridir."], ["Chidamlilik mashqlarida hujayraviy darajada qaysi koaktivator faollashib, mitoxondrial biogenezni qoʻllab-quvvatlaydi?", "Energiya tanqisligi va kalsiy signallari orqali PGC-1α koaktivatori faollashadi.", "HIF-1α omili yuqori harorat sharoitida hujayraviy himoyada ishtirok etadi.", "mTORC1 kompleksi mexanik taranglik va aminokislotalar signallari orqali faollashadi.", "Issiqlik shoki oqsillari (HSPs) gen ifodasi va oqsil almashinuvini boshqaradi."], ["Moslashuv jarayoni shartli ravishda besh bosqichga ajratiladi. Ularning toʻgʻri ketma-ketligini aniqlang.", "Tezkor safarbarlik, dastlabki tiklanish, kechikkan qayta qurilish, kumulyativ moslashuv, saqlanish yoki qaytish.", "Dastlabki tiklanish, tezkor safarbarlik, saqlanish, kumulyativ moslashuv, kechikkan qayta qurilish.", "Kumulyativ moslashuv, kechikkan qayta qurilish, tezkor safarbarlik, dastlabki tiklanish, saqlanish.", "Saqlanish yoki qaytish, kumulyativ moslashuv, kechikkan qayta qurilish, dastlabki tiklanish, tezkor safarbarlik."], ["Fik tenglamasi: VO₂ = Q × (CaO₂ – CvO₂) yurak-qon tomir va nafas tizimlarining kislorod yetkazishdagi rolini qanday ifodalaydi?", "Maksimal kislorod isteʼmoli (VO₂maks) yurak chiqishi va arterio-venoz kislorod farqi mahsulotidir.", "U faqat oʻpkadagi ventilyatsiya va gaz almashinuvining samaradorligini koʻrsatadi.", "Qonning gemoglobin bilan kislorod bogʻlanishining tezligini belgilab beradi.", "Organizmning faqatgina anaerob energiya ishlab chiqarish imkoniyatini taʼriflaydi."], ["Dizadaptatsiya jarayonida \"funksional ortiqcha yuklanish\" holati qanday tavsiflanadi?", "Ish qobiliyatining qisqa muddatli pasayishi boʻlib, tiklanishdan soʻng foyda berishi mumkin.", "Ish qobiliyatining uzoq muddatli pasayishi va koʻp omilli belgilar bilan kechadigan sindrom.", "Pasayish uzoqroq davom etadi, kutilgan foyda boʻlmaydi va kasallik belgilari bilan kechadi.", "Bu oddiy charchoq boʻlib, qisqa pasayishdan soʻng odatiy tiklanish yuz beradi."], ["Mashgʻulot zoʻriqishini baholashda \"Seans RPE\" (Rated Perceived Exertion) usuli qanday qoʻllaniladi?", "Sportchi zoʻriqishni 0-10 shkala boʻyicha baholaydi va ball mashgʻulot davomiyligiga koʻpaytiriladi.", "Ushbu usul faqat tashqi yuklamani (masofa, tezlik) oʻlchash uchun ishlatiladi va subyektiv emas.", "Bu faqatgina yurak urishi va laktat darajasi kabi ichki javoblarni obyektiv ravishda aks ettiradi.", "Seans RPE standart testlar va uyqu sifatini baholash orqali umumiy holatni aniqlaydi."], ["Adaptatsiya jarayoni organizmning gomeostaz holati bilan qanday chambarchas bogʻliq?", "Adaptatsiya takroriy ta'sir natijasida gomeostatik boshqaruv imkoniyatlarining oʻzini kengaytiradi.", "Gomeostaz adaptatsiyadan mustaqil ravishda, faqat joriy ta'sirlarni muvozanatlashtirishga javob beradi.", "Adaptatsiya gomeostazni butunlay bekor qilib, organizm ichki muhitini doimiy ravishda oʻzgartiradi.", "Gomeostaz faqatgina tashqi muhitga moslashuvni ta'minlaydi, adaptatsiya esa ichki muhitni boshqaradi."], ["Allostaz tushunchasining asosiy mohiyati va u kim tomonidan taklif qilingan?", "Organizmning kutilayotgan talabga oldindan tayyorlanib, \"o'zgarish orqali barqarorlik\"ni ifodalaydi, P. Sterling va J. Eyer tomonidan.", "Organizmning ichki muhitining oʻzgarmasligini ta'minlash mexanizmi boʻlib, Klod Bernar tomonidan taklif etilgan.", "Tashqi ta'sirlarga nisbatan umumiy, nospetsifik javobni aks ettiradi va Gans Selye tomonidan oʻrganilgan.", "Gomeostaz chegaralarini toraytirishga qaratilgan funksional boshqaruvdir, Uolter Kennon tomonidan kiritilgan."], ["Umumiy adaptatsion sindrom konsepsiyasini ishlab chiqqan va uning bosqichlarini tasvirlagan olim kim?", "Gans Selye, bu sindrom tashvish, rezistentlik va holdan toyish bosqichlaridan iboratligini koʻrsatgan.", "Klod Bernar, organizmning ichki muhit barqarorligi tushunchasiga asos solgan tadqiqotchidir.", "Uolter Kennon, gomeostaz atamasini ilmiy adabiyotga kiritish bilan tanilgan fiziologdir.", "P. Sterling va J. Eyer, allostaz tushunchasini zamonaviy fiziologiyaga kiritgan olimlardir."], ["Chidamlilik mashqlari skelet mushaklarida mitoxondrial oqsil miqdori va oksidlovchi fermentlar faolligini oshirishini kim aniqlagan?", "Jon Holloszy, 1967-yilda o'tkazgan tajribalarida mashq adaptatsiyasining biokimyoviy asoslarini oʻrgangan.", "Gans Selye, umumiy stress javoblarining fiziologik mexanizmlarini keng qamrovli oʻrgangan olim.", "F.Z. Meyerson, adaptatsiyaning shoshilinch va uzoq muddatli bosqichlarini ajratib oʻrgangan olim.", "Uolter Kennon, gomeostazni fiziologik boshqaruv tizimi sifatida tizimlashtirgan tadqiqotchi."], ["Tezkor fiziologik javobning dastlabki soniyalarida qanday asosiy oʻzgarishlar sodir boʻladi?", "Motor birliklari safarbar etiladi va simpatik asab tizimi faollashadi, energiya ATF va kreatinfosfat hisobiga ta'minlanadi.", "Glikogen va yog'lar zaxiralari faollashadi, terlash kuchayib, tana harorati tartibga solinadi.", "Oqsil sintezi kuchayib, gen ifodasi va mitoxondrial biogenez jarayonlari faollashadi.", "Yurak urishi va oʻpka ventilyatsiyasi pasayadi, qon oqimi esa dam olish holatiga qaytadi."], ["Uzoq muddatli moslashuvga olib keladigan jarayonlar zanjiri qanday ketma-ketlikda yuz beradi?", "Takroriy stimul → signal yo'llari → oqsil almashinuvi → organlar qayta qurilishi → yangi funksional holat.", "Organlar qayta qurilishi → oqsil almashinuvi → signal yo'llari → takroriy stimul → yangi funksional holat.", "Yangi funksional holat → takroriy stimul → signal yo'llari → oqsil almashinuvi → organlar qayta qurilishi.", "Oqsil almashinuvi → organlar qayta qurilishi → takroriy stimul → signal yo'llari → yangi funksional holat."], ["Hujayraviy darajada chidamlilik va kuch mashqlariga adaptatsiya mexanizmlari qanday farqlanadi?", "Chidamlilikda AMPK/CaMK/p38 MAPK orqali PGC-1α faollashuvi, kuch mashqlarida mTORC1 orqali oqsil sintezi kuchayadi.", "Kuch mashqlarida PGC-1α faollashuvi kuzatiladi, chidamlilik mashqlarida esa mTORC1 kompleksi faollashadi.", "Ikkala turdagi mashqda ham faqatgina HIF-1α omili hujayraviy himoyada ishtirok etadi va adaptatsiya yuz beradi.", "Chidamlilik mashqlari faqat mushak tolalarining gipertrofiyasiga olib keladi, kuch mashqlari esa mitoxondriyalar sonini oshiradi."], ["Moslashuv jarayoni shartli ravishda qanday besh asosiy bosqichga ajratiladi?", "Tezkor safarbarlik, dastlabki tiklanish, kechikkan qayta qurilish, kumulyativ moslashuv va saqlanish/qaytish.", "Energiya ishlab chiqarish, mushaklar gipertrofiyasi, kapillyar zichlik, nerv regulyatsiyasi va immun javob.", "Stress, rezistentlik, charchoq, qayta tiklanish va gomeostazning buzilishi kabi bosqichlarga.", "Haroratni tartibga solish, kislorod iste'moli, qon oqimi taqsimlanishi, gormonal oʻzgarishlar va uyqu rejimi."], ["Muntazam chidamlilik mashqlarining yurak-qon tomir tizimiga ta'sirida qanday asosiy oʻzgarishlar kuzatiladi?", "Plazma hajmi va yurakning zarb hajmi ortadi, submaksimal yuklamada yurak urishi pasayadi.", "Qon bosimi sezilarli darajada oshadi, qon oqimi tezligi pasayadi va yurak zarb hajmi kamayadi.", "Yurak urish tezligi maksimal yuklamada sezilarli darajada ortadi, plazma hajmi oʻzgarmaydi.", "Mushaklardagi kapillyarlar zichligi kamayadi va mitoxondrial imkoniyatlar pasayish tendensiyasiga ega bo'ladi."], ["Issiq iqlimga moslashuv (akklimatsiya) jarayonida organizmda qanday asosiy fiziologik oʻzgarishlar yuz beradi?", "Terlash ertaroq boshlanib samaraliroq bo'ladi, teri qon oqimi yaxshilanadi, plazma hajmi ortadi.", "Teri qon tomirlari torayadi, terlash kamayadi, tana harorati va yurak urishi sezilarli darajada oshadi.", "Eritropoez kuchayadi va kislota-ishqor muvozanati tezda oʻzgaradi, oʻpka ventilyatsiyasi kamayadi.", "Organizmda suv-tuz balansi buziladi, plazma hajmi kamayib, charchoq tez yuzaga keladi."], ["Adaptatsiya tushunchasi organizmning takroriy ta'sirlarga javoban oʻzgarishini qanday ifodalaydi?", "Organizmning tuzilishi va funksiyalarini qayta qurib, ta'sirlarni kamroq fiziologik zo'riqish bilan yengishidir.", "Organizmning har qanday ta'sirga doimiy va oʻzgarmas ravishda javob berishini anglatadi.", "Organizmning faqatgina genetik xususiyatlarga bog'liq holda rivojlanish jarayonini bildiradi.", "Organizmning ichki muhit koʻrsatkichlarini mutlaq barqaror holatda ushlab turish usulidir."], ["Uolter Kennonning fiziologiyaga qo'shgan muhim hissasi nima edi?", "1929-yilda “gomeostaz” atamasini kiritib, uni fiziologik boshqaruv tizimi sifatida tizimlashtirgan.", "Organizmning stressga javobini oʻrganib, adaptatsion sindromni ochib bergan edi.", "Jismoniy mashqlar skelet mushaklarida mitoxondriyalarning oʻsishini koʻrsatgan olimdir.", "Ichki muhit barqarorligi tushunchasini ilk bor fan doirasida asoslagan olim hisoblanadi."], ["Gans Selye 1936-yilda ta'riflagan umumiy adaptatsion sindromning bosqichlari qaysilar?", "Tashvish, rezistentlik va holdan toyish kabi uch bosqichdan iborat boʻladi.", "Tezkor safarbarlik, dastlabki tiklanish va kumulyativ moslashuvni oʻz ichiga oladi.", "Oʻzgarish orqali barqarorlik, adaptatsiya va dizadaptatsiya bosqichlaridan tashkil topadi.", "Molekulyar, hujayraviy, toʻqima va tizimli darajadagi moslashuvlarni birlashtiradi."], ["Mashq adaptatsiyasining spetsifiklik qonuniyati nimani anglatadi?", "Moslashuv bajarilgan mashq turi va faol ishlagan toʻqimalarga mos yuzaga keladi.", "Har qanday yuklama barcha mushak guruhlarida bir xil adaptatsiyani keltirib chiqaradi.", "Mashg'ulotlar doimiy ravishda ortib bormasa, adaptatsiya umuman yuzaga kelmaydi.", "Organizm turli xil yuklamalarga nisbatan umumiy va nospetsifik javobni hosil qiladi."], ["Chidamlilik mashqlarida hujayraviy darajadagi asosiy adaptatsion mexanizmlardan biri nima?", "PGC-1α koaktivatorining faollashishi orqali mitoxondrial biogenez va oksidlovchi imkoniyatning ortishi.", "Mushak tolalari gipertrofiyasining faqat mexanik taranglikka javoban yuzaga kelishi hisoblanadi.", "HIF-1α omilining faollashuvi natijasida kislorod transportining pasayishi va ish qobiliyatining yoʻqolishi.", "Issiqlik shoki oqsillarining sintezi kamayib, hujayralarning himoya mexanizmlari susayishi."], ["Muntazam chidamlilik mashqlari natijasida organizmda qanday oʻzgarishlar sodir boʻladi?", "Plazma hajmi va yurakning zarb hajmi ortadi, bir xil yuklamada yurak urishi pasayadi.", "Mushak tolalari ko'ndalang kesimi keskin kamayadi va mitoxondriyalarning faolligi susayadi.", "Teri qon oqimi keskin pasayadi va yog' hamda uglevodlardan foydalanish tezligi oshadi.", "Kapillyarlar zichligi pasayib, mushaklarda kislorod yetkazib berish qobiliyati yomonlashadi."], ["Adaptatsiya (moslashish) tushunchasining fiziologik ta'rifi qaysi javobda to'g'ri ifodalangan?", "Organizmning takroriy ta'sirlarga javoban tuzilishi va funksiyalarini qayta qurib, kamroq fiziologik zo'riqish bilan yengish imkoniyatini ta'minlashi.", "Organizmning ichki muhit barqarorligini doimiy ushlab turishi va tashqi o'zgarishlarga tezkor javob berishi bilan bog'liq jarayon.", "Atrof-muhit o'zgarishlariga javoban faqatgina xulq-atvor darajasida kechadigan, genetik kodlangan va qaytmas o'zgarishlar.", "Yangi patogenlarga qarshi immun tizimining reaksiyasi bo'lib, kasalliklarga qarshilikni oshirishga qaratilgan himoya mexanizmi."], ["Gomeostaz tushunchasi organizmning ichki muhiti koʻrsatkichlari barqarorligini qanday ta'minlaydi?", "Tana harorati, glyukoza, kislorod miqdorini funksional chegaralarda ushlab turuvchi dinamik boshqaruv orqali amalga oshiriladi.", "Faqat tashqi muhitdan keladigan stress omillariga javoban passiv mexanizmlar orqali ichki muhitni barqaror saqlaydi.", "Gen ifodasini o'zgartirish va oqsil sintezini kuchaytirish orqali hujayralar darajasida uzoq muddatli moslashuvni shakllantiradi.", "Asosan markaziy asab tizimi orqali avtomatik tarzda amalga oshiriluvchi, ixtiyoriy nazoratga bo'ysunmaydigan jarayonlarni boshqaradi."], ["Adaptatsiya va gomeostaz o'rtasidagi asosiy farq va bog'liqlikni aniqlang.", "Gomeostaz joriy ta'sirni muvozanatlashtirsa, adaptatsiya takroriy ta'sir natijasida boshqaruv imkoniyatlarini kengaytiradi.", "Gomeostaz faqat tashqi omillarga javoban yuzaga kelsa, adaptatsiya organizmning ichki muhitini to'liq nazorat qiladi.", "Adaptatsiya doimiy barqarorlikni ta'minlaydi, gomeostaz esa faqat shoshilinch vaziyatlarda ishga tushuvchi mexanizmdir.", "Adaptatsiya faqat fiziologik jarayonlarni qamrab oladi, gomeostaz esa faqat psixologik va xulq-atvor o'zgarishlarini boshqaradi."], ["Allostaz tushunchasi qanday ma'noni anglatadi va u kim tomonidan taklif etilgan?", "Organizmning kutilayotgan talabga oldindan tayyorlanib, koʻrsatkichlarni boshqariladigan tarzda oʻzgartirishi, P. Sterling va J. Eyer tomonidan 1988-yilda taklif etilgan.", "Organizmning tashqi muhitdagi o'zgarishlarga nisbatan statik javob berish qobiliyati bo'lib, Klod Bernar tomonidan 1865-yilda kiritilgan.", "Gans Selye tomonidan aniqlangan umumiy adaptatsion sindromning birinchi bosqichi bo'lib, organizmning stressga dastlabki reaksiyasini ifodalaydi.", "Ichki muhitning mutlaqo o'zgarmas holati bo'lib, unga ta'sir etuvchi barcha omillar Uolter Kennon tomonidan to'liq o'rganilgan."], ["Fransuz fiziologi Klod Bernar adaptatsiya fiziologiyasiga qanday muhim hissa qo'shgan?", "1865-yilda nashr etilgan asarida ichki muhit (milieu intérieur) barqarorligi g'oyasini asoslagan.", "1929-yilda \"gomeostaz\" atamasini kiritib, uni fiziologik boshqaruv tizimi sifatida tizimlashtirgan.", "1936-yilda umumiy adaptatsion sindromni – tashvish, rezistentlik va holdan toyish bosqichlarini aniqlagan.", "1967-yilda chidamlilik mashqlari skelet mushaklarida mitoxondrial oqsil miqdori ortishini tajribada ko'rsatgan."], ["Uolter Kennonning fiziologiya sohasiga qo'shgan asosiy hissasi nimadan iborat?", "\"Gomeostaz\" atamasini kiritgan va uni 1929-yilda fiziologik boshqaruv tizimi sifatida tizimlashtirgan.", "Ichki muhit barqarorligi g'oyasini ilgari surgan va uni \"milieu intérieur\" deb atagan.", "Umumiy adaptatsion sindromni tashvish, rezistentlik va holdan toyish bosqichlari bilan tavsiflagan olim.", "Mashq adaptatsiyasining biokimyoviy asoslarini o'rganib, mitoxondrial oqsil miqdorini oshirishni ko'rsatgan."], ["Adaptatsiya turlari vaqt ko'lamiga ko'ra qanday tasniflanadi?", "Tezkor (shoshilinch) javob va uzoq muddatli moslashuv kabi asosiy ikki turga bo'linadi.", "Faqatgina foydali moslashuv va dizadaptatsiya kabi natijalar bo'yicha farqlanadi.", "Biologik darajaga ko'ra molekulyar-hujayraviy va tizimli moslashuvlar deb ajratiladi.", "Asosiy farq jismoniy mashqqa va psixologik omillarga moslashuvga qarab belgilanadi."], ["Mashq adaptatsiyasining yetarli stimul qonuniyati asosida qanday prinsip yotadi?", "Yuklama organizm uchun odatiy darajadan yetarlicha yuqori bo'lishi kerak, aks holda moslashuv yuzaga kelmaydi.", "Moslashuvning bajarilgan mashq turi va faol ishlagan to'qimalarga mos yuzaga kelishini ifodalaydi.", "Stimul kamaysa yoki to'xtasa, erishilgan moslashuvning bir qismi yo'qolishini anglatuvchi tamoyil.", "Uyqu, oziqlanish va dam olish qayta qurilish uchun zarur sharoitlarni yaratishga xizmat qilishini belgilaydi."], ["Tezkor fiziologik javobning dastlabki soniyalardagi asosiy mexanizmlari qaysilar?", "Motor birliklari safarbar etiladi, simpatik asab tizimi faollashadi, energiya ATF va kreatinfosfat hisobiga ta'minlanadi.", "Mitochondrial biogenez va oksidlovchi fermentlar faolligi sezilarli darajada oshadi, bu jarayon bir necha hafta davom etadi.", "Mushak tolalarining ko'ndalang kesimi kattalashadi va oqsil sintezi mTORC1 kompleksi orqali kuchayadi.", "Plazma hajmi va yurakning zarb hajmi ortadi, qondagi glyukoza darajasi barqarorlashadi, teri qon oqimi yaxshilanadi."], ["Muntazam chidamlilik mashqlari natijasida yurak-qon tomir tizimida qanday adaptatsiyalar kuzatiladi?", "Plazma hajmi va yurakning zarb hajmi ortadi, submaksimal yuklamada yurak urishi pasayadi.", "O'pka ventilyatsiyasi pasayadi, qon oqimi faqat teri ostiga qayta taqsimlanadi.", "Qondagi glyukoza miqdori doimiy ravishda yuqori bo'lib qoladi, kislorod tashilishi kamayadi.", "Mitochondrial biogenez kamayadi, oksidlovchi fermentlar faolligi pasayadi."], ["Chidamlilik yuklamalari skelet mushaklarida qanday adaptatsiyalarni keltirib chiqaradi?", "Mitoxondriyalar va oksidlovchi fermentlar faolligi ortadi, kapillyarlanish yaxshilanadi, yog' va uglevodlardan tejamkor foydalanish sodir bo'ladi.", "Mushak tolalarining ko'ndalang kesimi sezilarli darajada kattalashadi, neyral omillar kamayadi.", "Fosfagen va glikolitik energiya tizimlari zaiflashadi, bufer imkoniyatlari pasayadi.", "Teri qon oqimi yaxshilanadi va terlash samaradorligi oshadi, ammo mushaklarda o'zgarishlar kuzatilmaydi."], ["Issiq iqlimga moslashuv (akklimatizatsiya) jarayonida organizmda qanday asosiy o'zgarishlar sodir bo'ladi?", "Terlash ertaroq boshlanadi va samaraliroq bo'ladi, teri qon oqimi yaxshilanadi, plazma hajmi ortadi, tana harorati va yurak urishi pastroq bo'ladi.", "O'pka ventilyatsiyasi pasayadi, buyraklar kislota-ishqor muvozanatini buzadi, eritropoez kuchayadi.", "Yurak zarb hajmi pasayadi, kapillyarlar zichligi kamayadi, mushaklarda yog'lardan foydalanish kamayadi.", "Asosan markaziy asab tizimi faollashadi, motor birliklari safarbar etiladi, terlash mexanizmi o'zgarmaydi."], ["Dizadaptatsiya qanday holatlarda rivojlanadi va uning bosqichlari qanday tavsiflanadi?", "Yuklama va tiklanish o'rtasidagi muvozanat buzilganda rivojlanib, oddiy charchoq, funksional va nofunksional ortiqcha yuklanish, ortiqcha mashqlanish sindromi kabi holatlarni o'z ichiga oladi.", "Organizmning tashqi muhit omillariga tezkor va samarali moslashuvi natijasida yuzaga keladigan ijobiy o'zgarishlar jamlanmasidir.", "Gomeostazning barqaror holatidan uzoqlashish bo'lib, har doim organizm uchun foydali fiziologik qayta qurilishga olib keladi.", "Mashg'ulotlarga nisbatan individual javobning turli odamlarda bir xil natija bermasligini anglatuvchi holatdir."], ["Moslashuvni kuzatishda foydalaniladigan uch guruh ko'rsatkichlar qaysilar?", "Tashqi yuklama (masofa, tezlik), ichki javob (yurak urishi, laktat) hamda natija va holat (testlar, uyqu, kayfiyat) kabi ko'rsatkichlar.", "Faqatgina genetik omillar, yosh va jinsga bog'liq statistik ma'lumotlar, tashqi muhit harorati.", "O'lchovsiz psixologik holat, subyektiv baholar (RPE), tibbiy ko'rik natijalari, dori vositalari ta'siri.", "Faqatgina tana vazni, tana yog'i foizi, mushak massasi indeksi, bo'y-balandlik kabi antropometrik o'lchovlar."], ["Moslashuv jarayonining beshta shartli bosqichi qanday ketma-ketlikda sodir bo'ladi?", "Tezkor safarbarlik, dastlabki tiklanish, kechikkan qayta qurilish, kumulyativ moslashuv va saqlanish/qaytish bosqichlari.", "Tashvish reaksiyasi, rezistentlik bosqichi, holdan toyish, funksional ortiqcha yuklanish va dizadaptatsiya bosqichlari.", "Molekulyar darajadagi o'zgarishlar, hujayraviy darajadagi o'zgarishlar, to'qima adaptatsiyasi, organ adaptatsiyasi va tizimli adaptatsiya.", "Yuklama ta'siri, gomeostazning buzilishi, allostatik yuklama, kompensatsiya va patologik o'zgarishlar bosqichlari."], ["Uzoq muddatli moslashuv qanday zanjir ko'rinishida kechadi?", "Takroriy mexanik/metabolik/termik stimul → asab/endokrin/ion/energetik/mexanik signallar → oqsil almashinuvi/mitoxondriyalar/kapillyarlar/boshqaruv mexanizmlarining qayta qurilishi → yangi funksional holat.", "Tezkor safarbarlik → dastlabki tiklanish → kechikkan qayta qurilish → kumulyativ moslashuv → saqlanish yoki qaytish.", "Ichki muhit barqarorligi → tashqi muhit o'zgarishi → gomeostazning buzilishi → kompensator javoblar → to'liq adaptatsiya.", "Yuklama shiddati → uyqu tanqisligi → energiya yetishmovchiligi → kasallik → psixologik zo'riqish → ortiqcha mashqlanish sindromi."], ["Adaptasiya (moslashish) organizmning oʻzgaruvchan tashqi muhit sharoitlariga moslashib, ichki muhit doimiyligini (gomoeostazni) saqlab qolish qobiliyatidir. Ushbu jarayonning mohiyatini aniqlang.", "Organizmning tashqi oʻzgarishlarga moslashib, ichki barqarorlikni saqlash qobiliyati hisoblanadi.", "Faqat tashqi muhitga moslashish orqali ichki muhitning doimiy oʻzgarib turishi jarayonidir.", "Organizmning faqat ichki muhit doimiyligini tashqi omillarga bogʻliq holda ushlab turishidir.", "Tashqi muhit sharoitlarining oʻzgarishiga qarshi kurashish uchun faqat stress reaksiyalari yigʻindisidir."], ["Adaptasiya jarayonining uch asosiy fazasi qanday nomlanadi va ularning ketma-ketligini aniqlang, bu organizmning moslashuv bosqichlarini aks ettiradi?", "Moslashuv (adjustment), transduksiya (transduction) va toʻliq adaptasiya (adaptation).", "Akklimatizasiya (acclimatization), adaptatsiya (adaptation) va genetik moslashish (genetic adaptation).", "Stress javobi (stress response), moslashuvchanlik (flexibility) va barqarorlik (stability).", "Hujayra reaksiyasi (cellular response), tizim oʻzgarishlari (systemic changes) va evolyutsion faza (evolutionary phase)."], ["Transduksiya fazasi adaptasiya jarayonida qanday muhim vazifani bajaradi, uning molekulyar asoslarini koʻrsatib bering?", "Hujayra darajasida signal uzatish jarayonlari faollashib, uzoq muddatli moslashishga zamin yaratadi.", "Organizmning faqat tashqi muhit sharoitlariga tezkor fiziologik javoblarini boshqaradi, stressni kamaytiradi.", "Toʻliq moslashishga erishgan organizmda stress omillariga nisbatan sezgirlikning oshishi kuzatiladi.", "Energiya sarfini optimallashtiradi va funksional tizimlarning samarali ishlashini ta'minlaydi."], ["Toʻliq adaptasiya fazasida organizmda qanday oʻzgarishlar sodir boʻladi, bu bosqichning asosiy xususiyatlarini tushuntiring?", "Organizm yangi sharoitlarga toʻliq moslashadi, stress reaksiyalari susayadi, energiya sarfi optimallashadi.", "Himoya mexanizmlari endi ishga tushadi, lekin organizm hali toʻliq moslashmagan holatda boʻladi.", "Hujayra
